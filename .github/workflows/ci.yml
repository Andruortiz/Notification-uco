name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar
        run: ./mvnw -B -ntp clean compile

      - name: Ejecutar pruebas
        run: ./mvnw -B -ntp test

      - name: Verificar cobertura
        run: ./mvnw -B -ntp jacoco:report jacoco:check

      - name: Análisis estático
        run: ./mvnw -B -ntp spotless:check spotbugs:check

      - name: Construir imagen Docker
        if: false
        run: docker build -t notification-service:${{ github.sha }} .

      - name: Publicar imagen
        if: false
        run: echo "pendiente de HU2-056"

      - name: Desplegar
        if: false
        run: echo "pendiente de HU2-057/HU2-061"
