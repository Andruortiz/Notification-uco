name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar
        run: ./mvnw -B -ntp clean compile

  test:
    name: "Test"
    needs: build
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5673:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Pruebas (unitarias, integracion, E2E con Testcontainers)
        run: ./mvnw -B -ntp test

      - name: Subir clases compiladas y datos de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/target/classes/**
            **/target/test-classes/**
            **/target/*.exec
          retention-days: 1
          if-no-files-found: error

  quality:
    name: "Code Quality"
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Descargar clases compiladas y datos de cobertura del job Test
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Puertas de calidad (Spotless, SpotBugs, cobertura)
        run: ./mvnw -B -ntp install -DskipTests

      - name: Construir imagen Docker
        if: false
        run: docker build -t notification-service:${{ github.sha }} .

      - name: Publicar imagen
        if: false
        run: echo "pendiente del Dockerfile (HU2-063, Fase 10)"

      - name: Desplegar
        if: false
        run: echo "pendiente de Fase 10 completa (HU2-064, HU2-066, HU2-068, HU2-069)"
