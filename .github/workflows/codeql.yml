name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 1 * * 0"
  workflow_dispatch:

jobs:
  analyze:
    name: Analizar (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Configurar el acceso a GitHub Packages
        run: mkdir -p ~/.m2 && cp .mvn/settings-github-packages.xml ~/.m2/settings.xml

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Compilar
        env:
          GITHUB_PACKAGES_USER: ${{ secrets.PACKAGES_USER }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: ./mvnw -B -ntp clean compile

      - name: Analisis CodeQL
        uses: github/codeql-action/analyze@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          category: "/language:java-kotlin"
