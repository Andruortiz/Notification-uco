<!doctype html>

<title>Consola Notification-uco Mockup</title>
<style>
:root{
  --page:#faf8f5;--rail:#fffdfb;--surface:#ffffff;--surface-subtle:#f5f2ec;--ink:#1c1917;--muted:#5c5650;--quiet:#8a847c;
  --line:#e8e3da;--line-strong:#d6cfc3;--brand:#d93a12;--brand-hover:#b32f0e;--brand-ink:#b3320e;--brand-soft:#fff0ea;--brand-glow:#ff5a36;
  --success-bg:#e3f3e6;--success-ink:#276a3a;--failure-bg:#fbe7e4;--failure-ink:#9c2417;--warning-bg:#fbf0d4;--warning-ink:#7c5a0a;
  --info-bg:#e5eefb;--info-ink:#264f8c;--pending-bg:#eeebe5;--pending-ink:#5c5650;--new-bg:#ece4f6;--new-ink:#5b3a8c;

  font:15px/1.55 var(--sans);color-scheme:light dark;color:var(--ink);background:var(--page);
}
@media (prefers-color-scheme:dark){:root{
  --page:#12100e;--rail:#171412;--surface:#1c1916;--surface-subtle:#25211d;--ink:#f4f0ea;--muted:#bdb5aa;--quiet:#968e83;
  --line:#342f29;--line-strong:#4a443c;--brand:#ff6a45;--brand-hover:#ff8664;--brand-ink:#ff9274;--brand-soft:#34201a;
  --success-bg:#1f3526;--success-ink:#9fd4ad;--failure-bg:#3d2320;--failure-ink:#f0a79d;--warning-bg:#3a3017;--warning-ink:#e3c67c;
  --info-bg:#1f2e47;--info-ink:#9dbdef;--pending-bg:#2a2621;--pending-ink:#bdb5aa;--new-bg:#2d2340;--new-ink:#c9b4ee;--shadow:0 18px 40px -16px rgb(0 0 0 / .7)}}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--page)}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 30%,transparent);outline-offset:2px}
h1,h2,h3{font-weight:700;color:var(--ink);margin:0}
h1{font-size:30px;line-height:1.08;letter-spacing:-.04em}
h2{font-size:22px;letter-spacing:-.025em}
h3{font-size:16px}
p{margin:0}
code{font-family:var(--mono);font-size:13px;border-radius:5px;padding:2px 7px;background:var(--surface-subtle);overflow-wrap:anywhere}

.app-nav__link{display:flex;min-height:42px;align-items:center;justify-content:space-between;gap:8px;padding:0 14px;border-radius:10px;text-decoration:none;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;transition:background-color .15s,color .15s}

.live-badge.open{background:var(--success-bg);color:var(--success-ink)}

.button,.catalog-action-button,.btn{display:inline-flex;min-height:44px;align-items:center;justify-content:center;padding:9px 18px;border-radius:10px;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;transition:background-color .15s,border-color .15s,transform .15s}
.button,.btn.pri{border:1px solid var(--brand);background:var(--brand);color:#fff}
.button:hover,.btn.pri:hover{border-color:var(--brand-hover);background:var(--brand-hover);transform:translateY(-1px)}
.catalog-action-button,.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink)}

.btn{min-height:38px;padding:6px 14px}

.table-frame,.tw{overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--surface)}

.data-table,.tw table{width:100%;border-collapse:collapse;text-align:left;font-size:14px}

.data-table thead,.tw thead{background:var(--surface-subtle)}
.data-table th,.tw th{text-align:left;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line-strong);padding:14px 12px;font-weight:600;white-space:nowrap}
.data-table td,.tw td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:middle}

.data-table tbody tr:last-child td,.tw tr:last-child td{border-bottom:0}

.mono{font-family:var(--mono);font-size:12px}

.card+.card{margin-top:16px}
.card.flash{box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent)}
.story-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px;align-items:start}
.story-grid .card+.card{margin-top:0}
.story-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.story-head b{flex:1 1 180px;font-size:15px}
.sid{font-family:var(--mono);font-size:12px;background:var(--surface-subtle);padding:2px 8px;border-radius:6px}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11px;font-weight:600;background:var(--info-bg);color:var(--info-ink);white-space:nowrap}
.pr-P1{background:var(--failure-bg);color:var(--failure-ink)}.pr-P2{background:var(--warning-bg);color:var(--warning-ink)}.pr-P3{background:var(--new-bg);color:var(--new-ink)}
.meta{color:var(--muted);font-size:12px;margin:3px 0 12px}
.body{display:grid;gap:12px}
.more{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;font-size:13px;color:var(--muted)}
.more summary{cursor:pointer;font-weight:600;color:var(--ink)}

.eb{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}

.eb-especificar,.eb-proveedores,.eb-alternativas{background:var(--info-bg);color:var(--info-ink)}

.card--off{opacity:.72}
.decision{border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:8px;padding:8px 12px;background:var(--brand-soft);font-size:13px}
.eb-final{background:var(--pending-bg);color:var(--pending-ink)}
.eb-sin{background:var(--failure-bg);color:var(--failure-ink)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
.filters label{display:grid;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
input,select,textarea{padding:9px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);min-width:0}
textarea{font-family:var(--mono);font-size:12px;resize:vertical}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.pagination{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.sp{justify-content:space-between}
.f{display:grid;gap:10px}.f label{display:grid;gap:4px;color:var(--muted);font-size:12px;font-weight:600}
.form-field{display:grid;gap:6px;margin-bottom:18px}.form-field label{font-size:13px;font-weight:600}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 24px}
dl{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin:0}dt{color:var(--muted)}dd{margin:0;min-width:0;overflow-wrap:anywhere}
.bd{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600}
.bd.ok{background:var(--success-bg);color:var(--success-ink)}.bd.warn{background:var(--warning-bg);color:var(--warning-ink)}.bd.bad{background:var(--failure-bg);color:var(--failure-ink)}.bd.info{background:var(--info-bg);color:var(--info-ink)}.bd.idle{background:var(--pending-bg);color:var(--pending-ink)}.bd.vio{background:var(--new-bg);color:var(--new-ink)}
.code{font-family:var(--mono);font-size:12px;background:var(--surface-subtle);border-radius:8px;padding:10px 12px;white-space:pre-wrap;overflow-x:auto;margin:0}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--warning-ink);padding:2px 12px}
.out{min-height:22px}
.sw{position:relative;width:36px;height:20px;display:inline-block;vertical-align:middle}
.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;background:var(--line-strong);border-radius:99px;transition:.15s;pointer-events:none}

.sw input:checked+span{background:var(--success-ink)}.sw input:checked+span::after{left:19px}
.sw input:focus-visible+span{outline:3px solid color-mix(in srgb,var(--brand) 30%,transparent);outline-offset:2px}
.bars{display:flex;align-items:flex-end;gap:4px;height:80px}.bars i{flex:1;background:var(--brand);border-radius:3px 3px 0 0;opacity:.85}
.meter{height:8px;background:var(--pending-bg);border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:var(--success-ink)}
.host{border:1px dashed var(--line-strong);border-radius:10px;padding:10px}.host .hb{display:flex;gap:8px;align-items:center;background:var(--surface-subtle);padding:6px 10px;border-radius:8px;margin-bottom:8px;font-size:12px}
.bell{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;cursor:pointer}.bell b{background:var(--brand);color:#fff;border-radius:99px;padding:0 7px;font-size:11px;margin-left:6px}
.inbox{border:1px solid var(--line);border-radius:10px;overflow:hidden}.inbox div{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}.inbox div:last-child{border:0}.inbox .u{font-weight:600}
.tl{list-style:none;margin:0;padding:0}.tl li{padding:0 0 12px 20px;position:relative;border-left:2px solid var(--line);margin-left:5px}
.tl li::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--quiet)}
.tl .g::before{background:var(--success-ink)}.tl .y::before{background:var(--warning-ink)}.tl .r::before{background:var(--failure-ink)}
.prev{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-subtle);white-space:pre-wrap}
.timeline{list-style:none;margin:0;padding:0}.timeline-item{position:relative;padding:0 0 20px 42px}.timeline-item:last-child{padding-bottom:0}
.timeline-item::before{content:'';position:absolute;left:13px;top:30px;bottom:2px;width:2px;background:var(--line)}.timeline-item:last-child::before{display:none}
.timeline-node{position:absolute;left:0;top:0;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;font-size:13px;font-weight:700}
.tn-ok{background:var(--success-bg);color:var(--success-ink)}.tn-warn{background:var(--warning-bg);color:var(--warning-ink)}.tn-bad{background:var(--failure-bg);color:var(--failure-ink)}
.timeline-item__head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:2px}.timeline-item__title{font-weight:600}
.detail-hero{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
.detail-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.detail-stat{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--surface)}.detail-stat dt{font-size:12px}.detail-stat dd{font-weight:700;font-size:17px;margin-top:2px}
.detail-columns{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start}
.detail-columns .card+.card{margin-top:0}
.catalog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.catalog-grid .card+.card{margin-top:0}
.provider-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.embed{border:1px dashed var(--line-strong);border-radius:10px;padding:18px;background:var(--surface-subtle)}
.tabs-sec{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.tabs-sec span{border:1px solid var(--line);border-radius:8px;padding:5px 12px;font-size:13px;background:var(--surface)}
.crit{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:12px 16px;background:var(--surface)}.kpi b{display:block;font-size:26px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}.kpi span{font-size:12px;color:var(--muted)}
.lvbar{display:grid;grid-template-columns:90px 1fr 40px;gap:10px;align-items:center;font-size:13px;margin:6px 0}
.dialog-overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgb(28 25 23 / .55)}
.dialog-overlay[hidden]{display:none}
.dialog-panel{width:100%;max-width:480px;border:1px solid var(--line);border-radius:12px;padding:28px;background:var(--surface);box-shadow:var(--shadow)}
.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.toast{position:fixed;right:18px;bottom:18px;z-index:50;background:var(--ink);color:var(--page);padding:11px 16px;border-radius:10px;max-width:360px;font-size:14px}
.toast[hidden]{display:none}
.back-link{display:inline-flex;align-items:center;gap:6px;margin-bottom:18px;color:var(--muted);text-decoration:none;font-weight:500;cursor:pointer;background:none;border:0;padding:0}
.back-link:hover{color:var(--ink)}
@media (max-width:900px){.app-shell{flex-direction:column}.app-nav{position:static;width:auto;height:auto;flex:none;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:12px}.app-nav__group{display:none}.app-nav__brand{margin:0 10px 0 0;padding:0 8px}.app-main{padding:28px 16px 48px}.story-grid{grid-template-columns:1fr}dl{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MODEL=[{"id":"B1","title":"Identidad solo desde el token","prio":"P1","rol":"SEG","nivel":1,"antes":1,"e":"aprobada","estado":"Aprobada","deps":[],"existe":"Casi hecha. Sin `X-Tenant-Id` (spec 015); claims de sujeto, tenant y rol configurables (`AuthPlatformProperties`); identidad por cookie de sesión (spec 025).","aclarar":"Falta el claim de cliente (ver B3a) y confirmar con Seguridad los nombres de claims (DEP-01). En el laboratorio el tenant llega como `tenant`, no `tenantId`: configurar `AUTH_PLATFORM_TENANT_CLAIM=tenant`.","cambio":"","body":"Como SEG quiero que el servicio tome usuario, tenant y rol únicamente de las claims del token de la plataforma para no depender de encabezados manipulables.\n- CA: se elimina `X-Tenant-Id` de las rutas protegidas.\n- CA: el nombre de cada claim (sujeto, tenant, rol, cliente) es configurable.\n- CA: un token sin las claims requeridas responde 401 con un código de error claro.","decision":"Retirar por completo el modo local; migrar pruebas y flujo de desarrollo."},{"id":"B4","title":"PDP simulado para desarrollo","prio":"P2","rol":"DEV","nivel":1,"antes":1,"e":"cerrada","estado":"Cerrada sin construir","deps":[],"existe":"El laboratorio `security-baseline-local` (Keycloak, PDP, PEP, OPA) ya emite tokens reales y sesión.","aclarar":"Probablemente redundante: documentar cómo levantar el laboratorio en vez de construir un PDP simulado. Consultar a Seguridad si hay uno oficial para CI.","cambio":"","body":"Como DEV quiero un PDP simulado que emita tokens con las claims reales esperadas para avanzar sin esperar a Seguridad (DEP-01).\n- CA: se levanta con un perfil de desarrollo y nunca en producción.\n- CA: permite emitir tokens de persona (con rol) y de aplicación (con `client_id`).","decision":"Descartada: se documenta el laboratorio de Seguridad como sustituto."},{"id":"C1","title":"Consola unificada como microfrontend","prio":"P1","rol":"AP","nivel":1,"antes":1,"e":"final","estado":"Para el final","deps":[],"existe":"Base hecha: microfrontend `@uco/notification-ui` (custom element con Shadow DOM, `mount`, `navigate`, `unmount`) y host Vue de prueba. `Front-Notification-seguridad` es una rama anterior ya contenida en el MFE.","aclarar":"Archivar `Front-Notification` y `Front-Notification-seguridad` al confirmar paridad. Lo que falta se movió a C1b.","cambio":"","body":"Como AP quiero administrar toda la plataforma desde un único frontend embebible para no mantener varias herramientas.\n- CA (cumplido): el repositorio `Front-Notification-mfe` (`@uco/notification-ui`) es la base y carga en el host Vue de prueba con una URL.\n- CA (cumplido): el cierre de sesión (`showLogout`) y la Security UI (`securityUiUrl`) se exponen como opciones del host.\n- CA (pendiente): archivar `Front-Notification` y `Front-Notification-seguridad` tras verificar paridad de pantallas.","decision":"Archivar los repos antiguos tras verificar paridad."},{"id":"C1b","title":"Puntos de entrada, contrato de sesión y tema del microfrontend","prio":"P1","rol":"AP","nivel":1,"antes":null,"e":"veremos","estado":"Veremos","deps":[],"existe":"Hoy hay un único `mount()`, un router en memoria con rutas fijas (`routes.tsx`) y una sola instancia por página.","aclarar":"Definir el contrato host↔MFE (eventos) y el registro de funcionalidades antes de construir las historias con pantalla.","cambio":"Nueva: recoge lo que faltaba de C1.","body":"Como AP quiero que el microfrontend ofrezca varios puntos de entrada, un contrato de sesión con el host y temas para poder embeber la bandeja y las preferencias en otras aplicaciones.\n- CA: además de `mount()` se exportan componentes sueltos (campana de la bandeja, centro de preferencias).\n- CA: ante un 401 el microfrontend avisa al host con un evento y no muestra un login propio.\n- CA: el tema se define con variables (`accent`, `fontFamily`, `radius`), como hace Security UI.\n- CA: un registro de funcionalidades: cada historia aporta sus rutas y su opción de menú, con el permiso que la protege.","decision":"Tema con accent, fontFamily y radius; valores por defecto de UCO."},{"id":"C3","title":"Prueba de conexión del proveedor","prio":"P1","rol":"AP","nivel":1,"antes":2,"e":"especificar","estado":"A especificar","deps":[],"existe":"El catálogo ya declara `simulated` como segundo proveedor de cada canal.","aclarar":"Una sonda por adaptador, sin enviar mensajes. Criterio: hay al menos dos proveedores por canal (con `simulated` se prueba).","cambio":"Ya no depende de E1 ni E2.","body":"Como AP quiero probar las credenciales de un proveedor antes de activarlo para evitar caídas.\n- CA: el botón \"Probar\" ejecuta una llamada inocua y muestra latencia y error si falla.\n- CA: ningún secreto se devuelve al navegador.\n- CA: un canal con dos proveedores habilitados puede probarse sin esperar a un segundo proveedor real.","decision":"Solo ADMINISTRADOR puede probar proveedores."},{"id":"D1","title":"Plantillas con variables","prio":"P1","rol":"ET","nivel":1,"antes":2,"e":"especificar","estado":"A especificar","deps":[],"existe":"","aclarar":"Condicionada a la decisión ¿las plantillas viven aquí o en MessageUcoLab (HU2-107 a HU2-110)? Motor de variables, categoría (F1) e idioma.","cambio":"","body":"Como ET quiero armar plantillas con variables (`{{nombre}}`) por canal e idioma para reutilizar mensajes.\n- CA: se detectan las variables y se declaran obligatorias u opcionales.\n- CA: una variable faltante al enviar responde 422 con la lista de faltantes.","decision":"La categoría del aviso se define en la plantilla."},{"id":"E1","title":"WhatsApp con Meta Cloud API","prio":"P1","rol":"AP","nivel":1,"antes":1,"e":"proveedores","estado":"Mirar otros proveedores","deps":[],"existe":"WhatsApp ya sale por Twilio (`twilio-whatsapp`, spec 028).","aclarar":"Comparar con la API oficial de Meta: costo, verificación del negocio, plantillas, webhooks de lectura.","cambio":"","body":"Como AP quiero evaluar otros proveedores de WhatsApp (por ejemplo la API oficial de Meta) frente a Twilio, para elegir con criterios y tener un segundo proveedor.\n- CA: se documenta una comparación (costo, capa gratuita, verificación del negocio en Meta, plantillas, estados de entrega y lectura).\n- CA: si se elige Meta: soporta plantillas, texto de sesión, multimedia y botones, y el webhook actualiza el estado (enviado, entregado, leído).\n- CA: se configura por variables de entorno hasta que exista la consola (C2).","decision":"Solo evaluar; pesa más estados de entrega y lectura."},{"id":"E2","title":"SMS gratuito mediante gateway propio","prio":"P1","rol":"AP","nivel":1,"antes":1,"e":"alternativas","estado":"Evaluar alternativas","deps":[],"existe":"SMS ya sale por Twilio (`twilio`, spec 009).","aclarar":"Evaluar el gateway Android propio y otras alternativas como segundo proveedor, con su límite de volumen.","cambio":"","body":"Como AP quiero evaluar alternativas de SMS (por ejemplo un gateway Android con SIM propia) frente a Twilio, para elegir con criterios y tener un segundo proveedor.\n- CA: se documenta una comparación (costo, volumen, fiabilidad, cumplimiento).\n- CA: si se elige una alternativa: adaptador detrás del puerto de proveedores existente.\n- CA: queda documentado que para volumen real hay que pasar a un proveedor de pago.","decision":"Solo evaluar; volumen bajo (decenas al día)."},{"id":"E3","title":"Failover entre proveedores","prio":"P1","rol":"AP","nivel":1,"antes":2,"e":"especificar","estado":"A especificar","deps":[],"existe":"El catálogo ya lista `simulated` como proveedor 2 de cada canal; permite probarlo. Base en HU2-048 y HU2-049 y spec 007.","aclarar":"Solo ante RECOVERABLE y en el mismo canal. Riesgo: `simulated` habilitado fuera de desarrollo marca entregas sin enviar (Principio VIII).","cambio":"Ya no depende de E1 ni E2.","body":"Como AP quiero que, si un proveedor falla, el servicio pase al siguiente automáticamente (RF-12) para no perder envíos.\n- CA: aplica sobre la ruta ordenada del canal e incluye circuit breaker.\n- CA: la notificación registra qué proveedor entregó y cuáles fallaron.\n- CA: `simulated` solo está habilitado en desarrollo; en un ambiente compartido el failover no puede terminar en un proveedor que no envía.","decision":"Failover solo ante RECOVERABLE."},{"id":"E5","title":"Registro de dispositivos","prio":"P1","rol":"DEV","nivel":1,"antes":1,"e":"especificar","estado":"A especificar","deps":[],"existe":"Hoy `recipientId` es la dirección misma (teléfono, correo o token FCM). Existe el adaptador FCM (spec 010).","aclarar":"¿\"Usuario\" es el `sub` del token o el `recipientId`? Propuesta: identidad de destinatario separada de la dirección, único `(tenant, token)` y token protegido.","cambio":"","body":"Como DEV quiero que cada usuario tenga una lista de dispositivos registrados para enviar a una persona sin conocer su token.\n- CA: `POST /devices`, listado y baja.\n- CA: los tokens inválidos se eliminan solos al recibir 404 o 410 del proveedor.\n- CA: cada dispositivo queda ligado a usuario, tenant y componente de origen.","decision":"Identidad propia del destinatario, con el sub opcional."},{"id":"E10","title":"Validación y limpieza de destinatarios","prio":"P2","rol":"OP","nivel":1,"antes":1,"e":"revisar","estado":"A revisar","deps":[],"existe":"`PhoneNumbers` valida el formato de teléfono (`utils`).","aclarar":"Separar validación de formato (barata) de rebotes (requieren eventos del proveedor, p. ej. Brevo).","cambio":"","body":"Como OP quiero validar formato de correo y número, y detectar rebotes, para no desperdiciar envíos ni dañar la reputación del dominio.\n- CA: se rechaza un destinatario con formato inválido antes de encolar.\n- CA: un rebote duro marca el destinatario como no entregable.","decision":"El rebote duro marca al destinatario como no entregable."},{"id":"G1","title":"Panel de salud de proveedores","prio":"P1","rol":"OP","nivel":1,"antes":2,"e":"especificar","estado":"A especificar","deps":[],"existe":"Métricas de las specs 020 y 021 (Prometheus y Grafana).","aclarar":"Mostrar lo que ya existe, sin duplicar métricas.","cambio":"","body":"Como OP quiero ver estado, tasa de éxito, latencia y último error de cada proveedor para detectar problemas.\n- CA: se alimenta de las métricas de las specs 020 y 021.","decision":"Vista propia ligera leída de Prometheus."},{"id":"G2","title":"Reintento manual y reenvío","prio":"P1","rol":"OP","nivel":1,"antes":2,"e":"sin","estado":"Sin etiqueta","deps":[],"existe":"Es la spec 018 (clarificada, 0 de 22 tareas).","aclarar":"Falta una etiqueta. Decisión pendiente: si el reintento reinicia el contador de intentos.","cambio":"","body":"Como OP quiero reintentar una notificación fallida desde la consola (spec 018) y reenviarla por otro canal.\n- CA: responde la decisión pendiente sobre si el reintento reinicia el contador de intentos.","decision":"El reintento manual no reinicia el contador."},{"id":"G3","title":"Línea de tiempo por notificación","prio":"P1","rol":"OP","nivel":1,"antes":2,"e":"especificar","estado":"A especificar","deps":[],"existe":"La búsqueda ya devuelve `deliveryAttempts` (fecha, resultado, origen, proveedor); el detalle por id no (HU2-026).","aclarar":"Faltan causa del fallo, latencia y `correlationId` por intento: hay que persistirlos.","cambio":"","body":"Como OP quiero ver cada intento, proveedor, respuesta y tiempo, con el `correlationId`, para diagnosticar rápido.","decision":"La causa técnica la ven OPERADOR y ADMIN."},{"id":"G8","title":"Pruebas de carga con resultado medible","prio":"P2","rol":"AP","nivel":1,"antes":1,"e":"especificar","estado":"A especificar","deps":[],"existe":"","aclarar":"¿Contra qué entorno? Propuesta: k6 contra el compose con proveedor simulado, resultado como artefacto de CI. Dato orientativo: un lote real de 100 correos con Brevo tardó cerca de 30 s de punta a punta.","cambio":"","body":"Como AP quiero demostrar con números el cumplimiento de RNF-03 (≥ 500 por minuto por réplica) y RNF-02 para sostener la entrega.\n- CA: script reproducible (k6 o Gatling) contra el servicio con proveedor simulado.\n- CA: el resultado queda visible en el dashboard de métricas existente.\n- Nota: se vuelve a ejecutar al cerrar los niveles posteriores.","decision":"Prueba nocturna; script fuera del producto, resultado como evidencia."},{"id":"B2","title":"Modelo de autorización no lineal y su aprovisionamiento","prio":"P1","rol":"AP","nivel":2,"antes":2,"e":"revisar","estado":"A revisar","deps":["B1"],"existe":"El servicio conoce 3 roles en cadena (`Role.satisfies`). Con el PEP activo delega la autorización. En el PDP los roles son de aplicación y los perfiles de tenant. La spec 028 aprovisiona 3 roles y 3 perfiles.","aclarar":"¿Perfiles múltiples por usuario? (sí). La sesión no trae roles: hace falta `/api/v1/authorize` o ampliar la sesión.","cambio":"Reformulada: la autorización vive en el PDP.","body":"Como AP quiero definir los roles de la plataforma (administrador de plataforma, administrador de aplicación, editor de plantillas, operador, auditor) como roles y perfiles del PDP, para dar el mínimo privilegio.\n- CA: el contrato declara por operación la lista de roles permitidos, no un rol mínimo en cadena.\n- CA: el generador de recursos y perfiles (spec 028) usa esa lista y crea los perfiles en cada tenant.\n- CA: un rol sin permiso recibe 403 del PEP.\n- Fuera de esta historia: ocultar acciones en la consola. Depende de que el PDP entregue los permisos del usuario.","decision":"5 roles administrativos más CLIENTE, como perfiles del PDP en cada tenant."},{"id":"B3a","title":"Identidad de aplicación en el principal","prio":"P1","rol":"DEV","nivel":2,"antes":null,"e":"veremos","estado":"Veremos","deps":["B1"],"existe":"El principal es `(subject, tenantId, role)` y no lleva cliente.","aclarar":"¿Cómo se llama el claim en los tokens de aplicación? ¿`applicationId` del PDP = `client_id`? Pregunta a Seguridad.","cambio":"Nueva: mitad de B3.","body":"Como DEV quiero que el servicio sepa qué aplicación llama para atribuir cada envío y aplicar reglas por aplicación.\n- CA: el principal incluye el cliente (`azp` o `client_id`, configurable).\n- CA: el identificador de la aplicación queda en logs y en el registro de actividad.\n- CA: un token sin el claim se trata como persona, no como aplicación.","decision":"Token de aplicación sin tenant: 401."},{"id":"B3b","title":"Credencial máquina a máquina","prio":"P1","rol":"DEV","nivel":2,"antes":null,"e":"veremos","estado":"Veremos","deps":["B1"],"existe":"Keycloak soporta `client_credentials`, pero el realm solo tiene los clientes `security-baseline-bff` y `security-pep-internal`.","aclarar":"Preguntas a Seguridad: cliente por aplicación y cómo el PDP asigna permisos a una cuenta de servicio.","cambio":"Nueva: otra mitad de B3. La API key propia se retira.","body":"Como DEV quiero autenticarme con un token de servicio emitido por la plataforma para enviar sin intervención humana.\n- CA: depende del flujo que defina Seguridad (por ejemplo `client_credentials` con un cliente por aplicación).\n- CA: no se crea una API key propia. Si Seguridad se retrasa más allá del 12 de noviembre, solo como excepción con dueño y fecha (Principio VII), apagable por configuración.","decision":"Esperar a Seguridad, sin excepción."},{"id":"B5","title":"Sesión de la consola mediante el host","prio":"P1","rol":"AP","nivel":2,"antes":2,"e":"revisar","estado":"A revisar","deps":["B1","C1b"],"existe":"Cookie del BFF (spec 025) y opción `showLogout`.","aclarar":"Definir el contrato host↔MFE y el evento ante un 401.","cambio":"","body":"Como AP quiero entrar a la consola ya autenticado desde el host de la plataforma para no iniciar sesión dos veces.\n- CA: el microfrontend recibe la sesión del host y respeta el cierre de sesión.\n- CA: ante un 401 la consola avisa al host en lugar de mostrar un login propio.","decision":"El host muestra el cierre de sesión; la consola avisa ante un 401."},{"id":"B6","title":"Registro de actividad y auditoría","prio":"P1","rol":"AU","nivel":2,"antes":2,"e":"especificar","estado":"A especificar","deps":["B1"],"existe":"Los envíos ya guardan `DeliveryAttempt`. El PDP conserva asignaciones revocadas con fecha, sin actor.","aclarar":"¿Qué es \"cambio\"? Propuesta: solo cambios de configuración, en una colección de solo anexado con actor, tenant, antes y después.","cambio":"","body":"Como AU quiero consultar quién cambió qué y cuándo para rendir cuentas.\n- CA: cada cambio guarda actor, tenant, antes y después, fecha y origen.\n- CA: el registro es de solo anexado; no se edita ni se borra desde la consola.","decision":"Se audita solo la configuración."},{"id":"D2","title":"Vista previa en vivo","prio":"P1","rol":"ET","nivel":2,"antes":3,"e":"revisar","estado":"A revisar","deps":["D1"],"existe":"","aclarar":"Es UI sobre D1; debe usar el mismo motor de render que el servidor.","cambio":"","body":"Como ET quiero ver la plantilla renderizada con datos de ejemplo, con la apariencia de cada canal.\n- CA: muestra el conteo de caracteres y avisa si el SMS excede un segmento.","decision":"Datos de ejemplo guardados en la plantilla."},{"id":"D3","title":"Enviar por `templateId` y variables","prio":"P1","rol":"DEV","nivel":2,"antes":3,"e":"especificar","estado":"A especificar","deps":["D1"],"existe":"`providerTemplate` ya existe para WHATSAPP (spec 028).","aclarar":"Campo `templateId` en el contrato v2 y 422 con la lista de faltantes. Condicionada a la decisión de plantillas.","cambio":"","body":"Como DEV quiero enviar `templateId` más variables para no armar el texto en cada componente.\n- CA: sigue aceptándose el contenido directo para compatibilidad.","decision":"Se conserva el cuerpo directo; plantilla y cuerpo conviven."},{"id":"D4","title":"Armar la plantilla con el evento recibido","prio":"P1","rol":"ET","nivel":2,"antes":3,"e":"especificar","estado":"A especificar","deps":["D1"],"existe":"","aclarar":"¿Qué es el \"evento entrante\"? Puede ser un endpoint de ingestión nuevo y grande.","cambio":"","body":"Como ET quiero mapear los campos del evento entrante a las variables de la plantilla para generar mensajes con lo que llegue.\n- CA: el mapeo admite rutas anidadas (`usuario.nombre`) y valores por defecto.","decision":"El evento es el mismo envío con variables."},{"id":"D5","title":"Plantillas de WhatsApp aprobadas","prio":"P1","rol":"ET","nivel":2,"antes":3,"e":"revisar","estado":"A revisar","deps":["D1","E1"],"existe":"`providerTemplate` ya envía plantillas aprobadas por el proveedor en WHATSAPP (spec 028).","aclarar":"Depende de la decisión de proveedor (Twilio o Meta). Falta sincronizar el estado de aprobación.","cambio":"","body":"Como ET quiero vincular una plantilla propia con la plantilla aprobada de Meta y ver su estado para saber cuándo puedo usarla.\n- CA: una plantilla sin aprobar no se puede publicar para producción.","decision":"Twilio ahora; se ajusta si E1 elige Meta."},{"id":"D7","title":"Bloques reutilizables","prio":"P2","rol":"ET","nivel":2,"antes":3,"e":"revisar","estado":"A revisar","deps":["D1"],"existe":"","aclarar":"Opcional hasta que exista D1.","cambio":"","body":"Como ET quiero componer plantillas con bloques compartidos (cabecera, pie legal) para mantener coherencia.","decision":"Entra."},{"id":"D8","title":"Localización","prio":"P2","rol":"ET","nivel":2,"antes":3,"e":"veremos","estado":"Veremos","deps":["D1"],"existe":"","aclarar":"Opcional hasta que exista D1.","cambio":"","body":"Como ET quiero definir varios idiomas y que se elija según la preferencia del destinatario, con un idioma por defecto como respaldo.","decision":"Veremos."},{"id":"E4","title":"Push web estándar VAPID","prio":"P1","rol":"DEST","nivel":2,"antes":2,"e":"cerrada","estado":"Cerrada sin construir","deps":["E5"],"existe":"","aclarar":"FCM ya cubre push web. VAPID propio añade service worker y claves. ¿Qué aporta?","cambio":"","body":"Como DEST quiero recibir notificaciones push en mi navegador sin depender de Firebase.\n- CA: el service worker del MFE solicita permiso y registra la suscripción en el registro de dispositivos.\n- CA: FCM sigue disponible como alternativa configurable.","decision":"Cerrada sin construir: se reutiliza FCM web."},{"id":"E6","title":"Bandeja in-app embebible","prio":"P1","rol":"DEST","nivel":2,"antes":2,"e":"especificar","estado":"A especificar","deps":["B1","C1b"],"existe":"","aclarar":"¿IN_APP es un canal del catálogo? \"Leído\" por usuario. El panel SSE (spec 006) es para operadores.","cambio":"","body":"Como DEST quiero una campana con mis notificaciones, contador y marca de leído para no perder mensajes.\n- CA: actualización en tiempo real con SSE.\n- CA: componente embebible en cualquier aplicación del host.","decision":"Canal IN_APP del catálogo."},{"id":"F1","title":"Preferencias por categoría y canal","prio":"P1","rol":"DEST","nivel":2,"antes":3,"e":"revisar","estado":"A revisar","deps":["B1","D1","E5"],"existe":"Es la spec 013 (0 de 19 tareas, Q1 a Q4 sin cerrar).","aclarar":"\"La categoría la define la plantilla\" la acopla a la decisión de plantillas.","cambio":"","body":"Como DEST quiero elegir por qué canal recibo cada tipo de aviso para controlar lo que me llega (spec 013).\n- CA: las notificaciones críticas (seguridad) no se pueden silenciar.\n- CA: la categoría la define la plantilla.\n- CA: antes se responden las clarificaciones Q1 a Q4 de la spec 013.","decision":"Categorías: académico, administrativo, marketing y seguridad (crítica)."},{"id":"F6","title":"Directorio de destinatarios","prio":"P2","rol":"DEV","nivel":2,"antes":2,"e":"revisar","estado":"A revisar","deps":["B1","E5","E10"],"existe":"","aclarar":"¿De dónde salen correo y teléfono? Duplicar datos personales aquí es un riesgo.","cambio":"","body":"Como DEV quiero enviar a un identificador de usuario y que la plataforma resuelva correo, teléfono y dispositivos.\n- CA: un usuario sin dato para el canal pedido responde con un error explícito.","decision":"Directorio por tenant, llenado por cada aplicación por API."},{"id":"H6","title":"Página de estado de la plataforma","prio":"P3","rol":"DEV","nivel":2,"antes":3,"e":"especificar","estado":"A especificar","deps":["G1"],"existe":"","aclarar":"¿Pública o interna? Si es interna, Grafana basta.","cambio":"","body":"Como DEV quiero una página de estado, como la de los SaaS, con incidentes y mantenimientos.","decision":"Página de estado interna."},{"id":"A1","title":"Vincular la configuración de negocio a una aplicación del PDP","prio":"P1","rol":"AP","nivel":3,"antes":3,"e":"especificar","estado":"A especificar","deps":["B3a","B6"],"existe":"El PDP registra aplicaciones (nombre, descripción, URL base), entrega la credencial una sola vez y deja al creador como administrador.","aclarar":"Preguntas a Seguridad: ¿`applicationId` = `client_id`? ¿Una aplicación en varios tenants?","cambio":"Reducida: el registro ya existe en el PDP.","body":"Como AP quiero asociar la configuración de negocio de un componente consumidor (canales, plantillas, límites) a su aplicación registrada en el PDP.\n- CA: la aplicación se identifica por el mismo valor que el PDP (nombre o `applicationId`).\n- CA: el registro, la credencial que se muestra una sola vez y los administradores se gestionan en el PDP; la consola enlaza a él.\n- CA: cada vínculo y cambio queda en la auditoría (B6).","decision":"El estado de la aplicación vive en el PDP."},{"id":"B7","title":"Detección de anomalías de uso","prio":"P3","rol":"AP","nivel":3,"antes":3,"e":"diferida","estado":"Diferida","deps":["B3a","B6","G1"],"existe":"","aclarar":"P3. ¿No bastan A4 y G9?","cambio":"","body":"Como AP quiero alertas cuando una aplicación dispara un volumen inusual o falla masivamente para actuar antes de que cause daño.","decision":"Diferida."},{"id":"C2","title":"Canales y proveedores desde la consola","prio":"P1","rol":"AP","nivel":3,"antes":3,"e":"especificar","estado":"A especificar","deps":["B2","B6","C3","E3"],"existe":"El catálogo es de solo lectura (specs 002 y 011); la escritura es HU2-044 y HU2-045. `ChannelHasEnabledProviderRule` ya exige al menos un proveedor habilitado.","aclarar":"La credencial como referencia a una bóveda depende de HU2-052, que no está entre estas historias.","cambio":"","body":"Como AP quiero activar, desactivar y ordenar proveedores por canal para cambiar de proveedor sin desplegar.\n- CA: el orden define el failover.\n- CA: guardar valida que cada canal activo conserve al menos un proveedor habilitado.\n- CA: la credencial se guarda como referencia a la bóveda y no se muestra de nuevo.","decision":"Credenciales por referencia a variables de entorno."},{"id":"C6","title":"Parámetros operativos editables","prio":"P2","rol":"AP","nivel":3,"antes":3,"e":"especificar","estado":"A especificar","deps":["B6"],"existe":"`ConfigurationValidator` ya valida reglas cruzadas; los parámetros se sincronizan desde el Componente de Parámetros (specs 019 y 022).","aclarar":"¿Editar aquí o en Parámetros? Hoy son dos fuentes de verdad.","cambio":"","body":"Como AP quiero editar parámetros como reintentos, tiempos de espera y límites de contenido desde la consola.\n- CA: respeta las reglas cruzadas que hoy valida `ConfigurationValidator`.\n- CA: cada cambio queda en la auditoría.","decision":"Se editan aquí hasta que Parámetros los libere; lo editado aquí manda."},{"id":"C7","title":"Tema y marca del tenant","prio":"P3","rol":"AP","nivel":3,"antes":4,"e":"revisar","estado":"A revisar","deps":["C1b","D7"],"existe":"Security UI acepta `theme { accent, fontFamily, radius }`.","aclarar":"Copiar ese patrón.","cambio":"","body":"Como AP quiero que cada tenant tenga logo y colores en sus correos y en la consola.","decision":"Entra."},{"id":"D6","title":"Versionado y revisión de plantillas","prio":"P2","rol":"ET","nivel":3,"antes":3,"e":"revisar","estado":"A revisar","deps":["B6","D1"],"existe":"","aclarar":"La revisión por otra persona no aplica con un equipo pequeño.","cambio":"","body":"Como ET quiero versionar plantillas y que otra persona las revise antes de publicar.\n- CA: las notificaciones guardan la versión usada.","decision":"Versionado siempre; revisión opcional."},{"id":"D9","title":"Redacción asistida de plantillas","prio":"P3","rol":"ET","nivel":3,"antes":4,"e":"diferida","estado":"Diferida","deps":["D2"],"existe":"","aclarar":"P3 innovadora. Revisar privacidad: el texto iría a un modelo de IA.","cambio":"","body":"Como ET quiero sugerencias de texto, corrección de tono y traducción automática, siempre con revisión humana.","decision":"Diferida."},{"id":"F2","title":"Centro de preferencias embebible","prio":"P2","rol":"DEST","nivel":3,"antes":4,"e":"revisar","estado":"A revisar","deps":["C1b","F1"],"existe":"","aclarar":"Es un punto de entrada del MFE (C1b).","cambio":"","body":"Como DEST quiero una pantalla propia, dentro del host, para gestionar mis preferencias.","decision":"Se identifica con la sesión del host."},{"id":"F3","title":"Horario de silencio y zona horaria","prio":"P2","rol":"DEST","nivel":3,"antes":4,"e":"especificar","estado":"A especificar","deps":["F1"],"existe":"","aclarar":"¿Qué es \"urgente\"? Usar `Priority`. Zona horaria por destinatario.","cambio":"","body":"Como DEST quiero no recibir avisos en ciertas horas para descansar.\n- CA: lo no urgente se difiere al fin del horario de silencio.","decision":"Urgente: prioridad HIGH o categoría seguridad."},{"id":"F4","title":"Digest o resumen","prio":"P2","rol":"DEST","nivel":3,"antes":4,"e":"revisar","estado":"A revisar","deps":["E6","F1"],"existe":"","aclarar":"Necesita agregación y un scheduler.","cambio":"","body":"Como DEST quiero un solo mensaje diario o semanal con lo pendiente para evitar saturación.","decision":"Entra."},{"id":"F5","title":"Baja con un clic y consentimiento","prio":"P2","rol":"AU","nivel":3,"antes":4,"e":"especificar","estado":"A especificar","deps":["B6","F1"],"existe":"","aclarar":"Base legal (habeas data, Ley 1581), enlace firmado sin login; las críticas no se silencian.","cambio":"","body":"Como DEST quiero darme de baja fácilmente y, como AU, quiero constancia del consentimiento para cumplir la normativa de datos personales.","decision":"Enlace de 90 días; constancia con fecha, canal y origen."},{"id":"G6","title":"Cuotas y rate limit por proveedor y tenant","prio":"P2","rol":"AP","nivel":3,"antes":3,"e":"revisar","estado":"A revisar","deps":["B6","E3"],"existe":"","aclarar":"Se solapa con HU2-051 y el rate limit por proveedor (Fase 5). Falta decidir el nivel del límite y un almacén compartido entre réplicas.","cambio":"","body":"Como AP quiero repartir la capacidad entre tenants y proveedores para que ninguno agote el servicio.\n- CA: el exceso devuelve 429 o queda `RECOVERABLE`, según la decisión que se tome sobre el límite (proveedor, canal o global).","decision":"Al exceder, queda RECOVERABLE y se reintenta."},{"id":"G7","title":"Programación de envíos","prio":"P3","rol":"DEV","nivel":3,"antes":3,"e":"especificar","estado":"A especificar","deps":["B3a","G2"],"existe":"Es CU-13, marcado \"brecha de arquitectura\".","aclarar":"Estado nuevo SCHEDULED y scheduler multi-réplica con actualización atómica.","cambio":"","body":"Como DEV quiero programar un envío para una fecha y hora (CU-13).\n- CA: un envío programado se puede cancelar antes de su hora.","decision":"Hasta 30 días de antelación; cancelable hasta la hora."},{"id":"G9","title":"Alertas operativas","prio":"P2","rol":"OP","nivel":3,"antes":3,"e":"especificar","estado":"A especificar","deps":["B6","G1"],"existe":"","aclarar":"¿Usar Alertmanager de Prometheus en vez de construirlo?","cambio":"","body":"Como OP quiero alertas cuando un proveedor cae o la cola crece para reaccionar a tiempo.","decision":"Alertmanager de Prometheus."},{"id":"H4","title":"Catálogo de plantillas institucionales","prio":"P3","rol":"ET","nivel":3,"antes":4,"e":"especificar","estado":"A especificar","deps":["D1","D7"],"existe":"","aclarar":"¿Quién escribe el contenido institucional?","cambio":"","body":"Como ET quiero un catálogo de plantillas listas para clonar (bienvenida, recuperación de acceso, recordatorio).","decision":"Entra."},{"id":"A2","title":"Matriz de canales por aplicación","prio":"P1","rol":"AP","nivel":4,"antes":4,"e":"especificar","estado":"A especificar","deps":["A1","C2"],"existe":"","aclarar":"Posible consumo desde Seguridad. Decidir qué decide cada lado: Seguridad (identidad, rol, ruta) o este servicio (canales, plantillas y límites por aplicación). Variante: claims con canales permitidos (revocación lenta).","cambio":"","body":"Como AP quiero definir qué canales puede usar cada aplicación para impedir usos no autorizados.\n- CA: un envío por un canal no permitido responde 403 `CHANNEL_NOT_ALLOWED`.\n- CA: un cambio en la matriz aplica sin reiniciar el servicio.\n- CA: una aplicación suspendida responde 403 `APPLICATION_SUSPENDED` en todos los canales.","decision":"Matriz por aplicación."},{"id":"A4","title":"Límites por aplicación","prio":"P2","rol":"AP","nivel":4,"antes":4,"e":"especificar","estado":"A especificar","deps":["A1","G6"],"existe":"","aclarar":"Igual que A2: decidir si el límite lo aplica Seguridad o este servicio.","cambio":"","body":"Como AP quiero fijar un tope por minuto y por día para proteger proveedores y presupuesto.\n- CA: al exceder, el envío responde 429 con `Retry-After`.\n- CA: la consola muestra el consumo frente al límite.","decision":"Por defecto 600 por minuto y 50 000 por día."},{"id":"A5","title":"Rotar y revocar credenciales (consumiendo el PDP)","prio":"P1","rol":"AA","nivel":4,"antes":4,"e":"revisar","estado":"A revisar","deps":["A1"],"existe":"El PDP rota con `POST /api/v1/applications/{id}/credential-rotations`; la anterior deja de servir al instante.","aclarar":"Pedir convivencia a Seguridad o documentar el corte.","cambio":"Reducida: el PDP ya rota la credencial.","body":"Como AA quiero rotar la credencial de mi aplicación desde la consola, que usa el PDP, para responder a una filtración.\n- CA: la acción llama a la rotación del PDP y muestra la nueva credencial una sola vez.\n- CA: la consola advierte que la credencial anterior deja de servir de inmediato y que hay que actualizar `PEP_REGISTRATION_TOKEN`.\n- CA (pendiente de Seguridad): si el PDP ofrece convivencia de credenciales, un plazo configurable.","decision":"Corte con aviso y lista de pasos; se pide convivencia a Seguridad."},{"id":"A6","title":"Entornos por aplicación","prio":"P3","rol":"AA","nivel":4,"antes":4,"e":"cerrada","estado":"Cerrada sin construir","deps":["A1","C2"],"existe":"","aclarar":"Se resuelve con despliegues separados.","cambio":"","body":"Como AA quiero un entorno de pruebas y otro de producción con matrices distintas para probar sin riesgo.","decision":"Cerrada sin construir: entornos como despliegues separados."},{"id":"C4","title":"Borrador y publicación con historial","prio":"P2","rol":"AP","nivel":4,"antes":4,"e":"revisar","estado":"A revisar","deps":["B6","C2"],"existe":"","aclarar":"Es versionado atómico con reversión (complejo). Alternativa: auditoría y rollback manual.","cambio":"","body":"Como AP quiero preparar cambios en borrador y publicarlos juntos, con posibilidad de volver a una versión anterior, para no dejar la plataforma a medias.\n- CA: la publicación es atómica y la reversión crea una nueva versión.","decision":"Auditoría y reversión manual, sin publicación atómica."},{"id":"C5","title":"Importar y exportar la configuración","prio":"P2","rol":"AP","nivel":4,"antes":4,"e":"diferida","estado":"Diferida","deps":["A1","C2","D1"],"existe":"","aclarar":"La exportación incluye referencias, no secretos.","cambio":"","body":"Como AP quiero exportar la configuración a JSON e importarla en otro entorno para promover de pruebas a producción.\n- CA: la exportación nunca incluye secretos.","decision":"Diferida."},{"id":"C8","title":"Guía de integración en contexto","prio":"P2","rol":"DEV","nivel":4,"antes":4,"e":"revisar","estado":"A revisar","deps":["A1"],"existe":"","aclarar":"Se genera del OpenAPI; espera un contrato estable.","cambio":"","body":"Como DEV quiero ver, junto a cada aplicación, un ejemplo de código listo para copiar con su `appId` para integrar en minutos.","decision":"Ejemplos en curl y Java."},{"id":"D10","title":"Prueba A/B de plantillas","prio":"P3","rol":"AA","nivel":4,"antes":4,"e":"revisar","estado":"A revisar","deps":["A1","D2","E6"],"existe":"","aclarar":"P3 innovadora.","cambio":"","body":"Como AA quiero comparar dos versiones y ver cuál se abre o se lee más.","decision":"Entra."},{"id":"E8","title":"Canales adicionales","prio":"P3","rol":"AP","nivel":4,"antes":4,"e":"especificar","estado":"A especificar","deps":["C2"],"existe":"","aclarar":"Un canal por historia; empezar por el webhook genérico.","cambio":"","body":"Como AP quiero conectar Telegram, Microsoft Teams, Slack o un webhook genérico mediante un adaptador estándar y activarlos desde la consola.","decision":"Primero el webhook genérico."},{"id":"E9","title":"Canal de voz","prio":"P3","rol":"AP","nivel":4,"antes":4,"e":"diferida","estado":"Diferida","deps":["C2"],"existe":"","aclarar":"Requiere proveedor de voz y demanda real.","cambio":"","body":"Como AP quiero un canal de llamada automática para alertas críticas.","decision":"Diferida."},{"id":"G4","title":"Webhooks firmados de estado de entrega","prio":"P2","rol":"DEV","nivel":4,"antes":4,"e":"especificar","estado":"A especificar","deps":["A1","B3a"],"existe":"","aclarar":"HMAC por aplicación, backoff con `RetryPolicy` y validación anti-SSRF de la URL.","cambio":"","body":"Como DEV quiero recibir en mi componente los eventos de entrega, firmados y con reintentos, para reaccionar (estilo Stripe).","decision":"5 reintentos con espera creciente, luego DLQ."},{"id":"G5","title":"Modo prueba por aplicación","prio":"P1","rol":"DEV","nivel":4,"antes":4,"e":"revisar","estado":"A revisar","deps":["A1","E3"],"existe":"Existe `SimulatedNotificationProvider`.","aclarar":"Resolver con el proveedor simulado por aplicación.","cambio":"","body":"Como DEV quiero que mis envíos de prueba lleguen a un destino controlado y que la consola muestre qué se habría enviado.","decision":"Los envíos de prueba van al proveedor simulado."},{"id":"A3","title":"Proveedores, remitentes y plantillas permitidos por aplicación","prio":"P2","rol":"AP","nivel":5,"antes":5,"e":"especificar","estado":"A especificar","deps":["A2","C2","D1"],"existe":"","aclarar":"Unificar con A2 en un solo perfil de aplicación.","cambio":"","body":"Como AP quiero limitar qué proveedores, remitentes y plantillas usa una aplicación para controlar costo y marca.\n- CA: enviar con una plantilla no asignada responde 403 `TEMPLATE_NOT_ALLOWED`.","decision":"Se unifica con A2 en un perfil de aplicación."},{"id":"A7","title":"Aprobación de cambios sensibles","prio":"P3","rol":"AP","nivel":5,"antes":5,"e":"diferida","estado":"Diferida","deps":["A2","B2","C4"],"existe":"","aclarar":"El criterio de cuatro ojos no aplica con un equipo pequeño. P3.","cambio":"","body":"Como AP quiero que habilitar un canal de pago o un proveedor nuevo requiera la aprobación de un segundo administrador (cuatro ojos).\n- CA: quien solicita no puede aprobar su propio cambio.","decision":"Diferida."},{"id":"E7","title":"Selección de canal inteligente","prio":"P2","rol":"AP","nivel":5,"antes":5,"e":"diferida","estado":"Diferida","deps":["A2","E3","E4","E6"],"existe":"","aclarar":"Necesita señal de \"leído\": solo WhatsApp, push y bandeja la dan.","cambio":"","body":"Como AP quiero reglas del tipo \"intentar push; si no se lee en 10 minutos, enviar correo\" para aumentar la entrega efectiva.\n- CA: las reglas se definen por aplicación y respetan la matriz de canales permitidos.","decision":"Diferida."},{"id":"H1","title":"Simulador de reglas \"¿qué pasaría si...?\"","prio":"P3","rol":"AP","nivel":5,"antes":5,"e":"diferida","estado":"Diferida","deps":["A2","C2","F1"],"existe":"","aclarar":"Necesita un motor de reglas unificado antes.","cambio":"","body":"Como AP quiero simular un envío con una aplicación, un canal y un usuario para ver qué regla lo permitiría o bloquearía antes de publicar un cambio.\n- CA: indica cuál regla decidió el resultado (matriz, preferencia, horario de silencio, límite).","decision":"Diferida."},{"id":"H3","title":"Mapa de costo por canal y aplicación","prio":"P3","rol":"AP","nivel":5,"antes":5,"e":"revisar","estado":"A revisar","deps":["A4","G6"],"existe":"","aclarar":"P3 innovadora.","cambio":"","body":"Como AP quiero ver cuánto cuesta cada aplicación y canal, aunque hoy sea estimado, para decidir cuándo conviene pasar a un proveedor de pago.","decision":"Entra, con tarifas cargadas a mano."},{"id":"A8","title":"Resumen \"qué puede hacer esta aplicación\"","prio":"P2","rol":"AU","nivel":6,"antes":6,"e":"especificar","estado":"A especificar","deps":["A2","A3","A4"],"existe":"","aclarar":"Solo lectura; al final.","cambio":"","body":"Como AU quiero una pantalla que resuma canales, proveedores, plantillas, límites y último uso de cada aplicación para auditar accesos.","decision":"Entra."},{"id":"H2","title":"Mejor canal y mejor hora por destinatario","prio":"P3","rol":"AP","nivel":6,"antes":6,"e":"diferida","estado":"Diferida","deps":["E7","F3","G3"],"existe":"","aclarar":"P3 innovadora. Privacidad: solo datos consentidos.","cambio":"","body":"Como AP quiero que la plataforma aprenda por qué canal y a qué hora responde cada destinatario, y lo proponga como sugerencia.\n- CA: es una propuesta que una persona acepta; nunca cambia el enrutamiento sola.\n- CA: solo usa datos que el destinatario ha consentido.","decision":"Diferida."},{"id":"H5","title":"Asistente de integración","prio":"P3","rol":"DEV","nivel":6,"antes":6,"e":"diferida","estado":"Diferida","deps":["C8","H1"],"existe":"","aclarar":"P3 innovadora. Privacidad.","cambio":"","body":"Como DEV quiero describir mi caso y recibir el fragmento de código y la configuración sugerida de matriz de canales, plantillas y límites.\n- CA: la configuración sugerida pasa por el simulador (H1) antes de aplicarse.","decision":"Diferida."}];

 const out=tpl.replace(/\{\{(\w+)\??\}\}/g,(m,n)=>{const v=get(ev,map[n]||n);return v==null?"":v});
 $("#prev").textContent=out;
 const l=out.length;$("#cnt").textContent=l+" caracteres · EMAIL"+(l>160?" · como SMS serían "+Math.ceil(l/153)+" segmentos":"");
}
function provList(){
 $("#provList").innerHTML=provs.map((p,i)=>`<div class="row sp" style="padding:6px 0;border-top:1px solid var(--line)"><span>${i+1}. ${p[0]}</span><span class="row"><button class="btn" data-mv="${i}|-1" aria-label="Subir">↑</button><button class="btn" data-mv="${i}|1" aria-label="Bajar">↓</button>${W(p[1],"",p[0]).replace('data-t=""',`data-pv="${i}"`)}</span></div>`).join("");
}
document.addEventListener("click",e=>{
 const g=e.target.closest("[data-go]");if(g){e.preventDefault();go(where[g.dataset.go],g.dataset.go);return}
 const lvc=e.target.closest("#lvchips .chip");if(lvc){document.querySelectorAll("#lvchips .chip").forEach(c=>c.setAttribute("aria-pressed",String(c===lvc)));drawMap();return}
 const t=e.target.closest("[data-t]");if(t&&t.tagName==="BUTTON"&&t.dataset.t){toast(t.dataset.t);return}
 const mv=e.target.closest("[data-mv]");if(mv){const [i,d]=mv.dataset.mv.split("|").map(Number);const j=i+d;if(provs[j]){[provs[i],provs[j]]=[provs[j],provs[i]];provList();$("#pOut").innerHTML=bd("orden guardado y auditado","ok")}return}
 const a=e.target.closest("[data-act]");if(!a)return;const x=a.dataset.act,o=id=>$("#"+id);
 if(x==="retry"){o("retryOut").innerHTML=bd("202 aceptado","ok")+" intento MANUAL registrado"}
 if(x==="bell"){o("bc").textContent="0";document.querySelectorAll("#inbox .u").forEach(d=>d.classList.remove("u"));toast("marcadas como leídas")}
 if(x==="vapid"){o("vp").innerHTML=bd("permitido y suscrito","ok");toast("dispositivo web-vapid registrado")}
 if(x==="newapp"){o("appOut").innerHTML=`${bd("creada","ok")} credencial (se muestra una sola vez): <span class="mono">uco_sk_${Math.random().toString(36).slice(2,12)}</span><br>auditada`}
 if(x==="trysend"){const ap=o("ta").value,ch=o("tc").value;o("tOut").innerHTML=apps[ap]==="suspendida"?bd("403 APPLICATION_SUSPENDED","bad"):matrix[ap][ch]?bd("202 aceptado","ok"):bd("403 CHANNEL_NOT_ALLOWED","bad")}
 if(x==="rotate"){o("rOut").innerHTML=`${bd("nueva credencial","ok")} <span class="mono">uco_sk_${Math.random().toString(36).slice(2,12)}</span><br>la vieja sigue válida ${o("grace").value}`}
 if(x==="revoke"){o("cs").innerHTML=bd("revocada","bad");o("rOut").textContent="Invalidada de inmediato y auditada."}
 if(x==="probe"){const n=o("pt").value,ok=!/Gateway/.test(n);o("prOut").innerHTML=ok?bd("OK","ok")+` latencia ${300+Math.floor(Math.random()*500)} ms`:bd("falló","bad")+" connection refused (gateway sin conexión)"}
 if(x==="fail"){o("fOut").innerHTML=`${bd("entregado","ok")} por SMTP de respaldo<br>fallaron: Brevo (circuit breaker abierto)`}
 if(x==="param"){const a1=+o("pto").value,b1=+o("pri").value;o("pmOut").innerHTML=a1<b1?bd("guardado y auditado","ok"):bd("rechazado","bad")+" el timeout del proveedor debe ser menor que el intervalo de reencolado"}
 if(x==="sim"){const ap=o("sa").value,ch=o("sc").value,u=o("su").value,h=+o("sh").value;let r;
  if(apps[ap]==="suspendida")r=["bloquea","aplicación suspendida"];else if(!matrix[ap][ch])r=["bloquea","matriz de canales (A2)"];else if(/baja/.test(u))r=["bloquea","preferencia del destinatario (F1)"];else if(h>=22||h<7)r=["difiere","horario de silencio (F3), sale a las 07:00"];else r=["permite","ninguna regla lo impide"];
  o("sOut").innerHTML=bd(r[0],r[0]==="permite"?"ok":r[0]==="difiere"?"warn":"bad")+" Regla que decidió: <b>"+r[1]+"</b>"}
 if(x==="valid"){const v=o("vi").value;const em=/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(v),ph=/^\+\d{10,14}$/.test(v);o("vOut").innerHTML=em||ph?bd("formato válido","ok"):bd("rechazado antes de encolar","bad")+" formato inválido"}
 if(x==="dir"){const ana=/ana/.test(o("fu").value),ch=o("fc").value;o("dOut").innerHTML=ana&&ch==="SMS"?bd("error explícito","bad")+" ana no tiene teléfono para SMS":bd("resuelto","ok")+" "+(ch==="EMAIL"?"ana@uco.edu.co":ch==="SMS"?"+57 300 555 0142":"2 dispositivos")}
 if(x==="claims"){let c={};try{c=JSON.parse(o("clm").value)}catch(e){o("clOut").innerHTML=bd("401 TOKEN_INVALID","bad");return}
  const miss=["sub","tenant"].filter(k=>!c[k]);o("clOut").innerHTML=miss.length?bd("401 CLAIM_MISSING","bad")+" falta: "+miss.join(", "):bd("200","ok")+` identidad: ${esc(c.sub)} · ${esc(c.tenant)}${c.azp?" · "+esc(c.azp):""}`}
 if(x==="pdp"){const app=/aplicación/.test(o("pk").value);o("pdOut").innerHTML=C(app?`{"azp":"app-demo","tenant":"universidad-uco","iss":"security-baseline"}`:`{"sub":"dev","tenant":"universidad-uco","iss":"security-baseline"}`)}
 if(x==="e401"){o("e401").innerHTML=bd("aviso enviado al host","ok")+" la consola no muestra login propio"}
});
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.dataset.m){const [a,c]=t.dataset.m.split("|");matrix[a][c]=t.checked?1:0;toast("Matriz aplicada sin reiniciar el servicio")}
 else if(t.dataset.pv!==undefined){const i=+t.dataset.pv;provs[i][1]=t.checked?1:0;if(!provs.some(p=>p[1])){provs[i][1]=1;t.checked=true;$("#pOut").innerHTML=bd("rechazado","bad")+" EMAIL debe conservar al menos un proveedor habilitado"}else $("#pOut").innerHTML=bd("guardado y auditado","ok")}
 else if(t.dataset.t){toast(t.dataset.t)}
});

document.addEventListener("input",e=>{if(e.target.id==="tpl"||e.target.id==="evt")tplRender();if(["mq","ml","mp","mr","mc"].includes(e.target.id))drawMapa();if(["lq","lch","lst"].includes(e.target.id))drawListado();if(e.target.id==="thc"){const c=e.target.value;$("#thb").style.background=c}});
document.addEventListener("change",e=>{if(["ml","mp","mr","mc"].includes(e.target.id))drawMapa();if(e.target.id==="thr")$("#thb").style.borderRadius=e.target.value});
document.addEventListener("click",e=>{
 const ec=e.target.closest("#echips .chip");if(ec){document.querySelectorAll("#echips .chip").forEach(c=>c.setAttribute("aria-pressed",String(c===ec)));drawMapa();return}
 const row=e.target.closest("tr[data-row]");if(row){openDetalle(row.dataset.row);return}
 if(e.target.closest("#dback")){$("#dview").hidden=true;$("#lview").hidden=false;return}
 if(e.target.closest("#dretry")){$("#dlgp").innerHTML=`<h2>Reintentar ${esc(curN.ext)}</h2><p class="page-subtitle" style="margin-top:8px">Se enviará de nuevo por ${curN.ch}. El intento queda registrado como MANUAL.</p><div class="dialog-actions"><button class="catalog-action-button" id="dno" type="button">Cancelar</button><button class="button" id="dok" type="button">Confirmar reintento</button></div>`;$("#dlg").hidden=false;return}
 if(e.target.id==="dno"){closeDialog();return}
 if(e.target.id==="dok"){const b=e.target;b.disabled=true;b.textContent="Enviando…";setTimeout(()=>{closeDialog();curN.st="IN_PROCESS";curN.att.push([new Date().toTimeString().slice(0,8),"ACCEPTED",curN.prov,"MANUAL","—",640,"c-nuevo"]);$("#dview").innerHTML=detalleHtml(curN);drawListado();toast("202 aceptado: reintento en curso")},800);return}
 if(e.target.id==="lsim"){if(!liveOn){toast("Sin conexión: el evento no llega");return}const t=SN.find(n=>n.st==="PENDING"||n.st==="IN_PROCESS");if(t){t.st=t.st==="PENDING"?"IN_PROCESS":"DELIVERED";if(!t.att.length&&t.st==="DELIVERED")t.att.push(["ahora","ACCEPTED",t.prov,"AUTOMATIC","—",600,"c-vivo"]);drawListado();toast("UPSERT: "+t.ext+" pasó a "+t.st)}else toast("No hay notificaciones en curso");return}
 if(e.target.id==="ldrop"){liveOn=false;const b=$("#live");b.className="live-badge reconnecting";b.textContent="Reconectando…";setTimeout(()=>{liveOn=true;b.className="live-badge open";b.textContent="En vivo";toast("Reconectado: se resincronizó la foto vigente")},2200);return}
 if(e.target.id==="nsend"){const prog=$("#nw").value,t=$("#nt").value;$("#nout").textContent=prog?"Programada para "+prog.replace("T"," ")+" (G7)":"202 aceptado"+(t?" con la plantilla "+t+" (D3)":"");toast("Envío de ejemplo: no se llama al backend");return}
},true);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDialog();if(e.key==="Enter"&&e.target.matches&&e.target.matches("tr[data-row]"))openDetalle(e.target.dataset.row)});
document.addEventListener("click",e=>{if(e.target.id==="dlg")closeDialog()});
document.addEventListener("click",e=>{const a=e.target.closest("[data-act='claims2']");if(!a)return;let c={};try{c=JSON.parse($("#clm2").value)}catch(x){$("#cl2Out").innerHTML=bd("401 TOKEN_INVALID","bad");return}const miss=["sub","tenant"].filter(k=>!c[k]);$("#cl2Out").innerHTML=miss.length?bd("401 CLAIM_MISSING","bad")+" falta: "+miss.join(", "):bd("200","ok")+" persona o aplicación: <b>"+(c.azp?"aplicación "+esc(c.azp):"persona "+esc(c.sub))+"</b> · tenant "+esc(c.tenant)});
drawMapa();drawListado();provList();tplRender();go("inicio");
</script>
