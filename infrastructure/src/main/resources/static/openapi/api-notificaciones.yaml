            schema:
              $ref: '#/components/schemas/UpdateTemplateRequest'
      responses:
        '200':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Plantilla actualizada con la versión incrementada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/PepUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Plantillas]
      summary: Listar plantillas
      description: HU2-119. Lista las plantillas del tenant con filtros combinables y paginación.
      operationId: listTemplates
      x-status: available
      x-allowed-roles: [CLIENTE, OPERADOR, EDITOR_PLANTILLAS, ADMINISTRADOR_APLICACION, ADMINISTRADOR_PLATAFORMA]
      parameters:
