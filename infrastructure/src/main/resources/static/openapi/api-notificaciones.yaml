      x-allowed-roles: [EDITOR_PLANTILLAS, ADMINISTRADOR_PLATAFORMA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTemplateBlockRequest'
      responses:
        '200':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Bloque actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateBlockResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/PepUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Plantillas]
      summary: Listar bloques reutilizables
      description: >
        HU2-130 (planificada). Filtros por clave, canal, idioma y estado; paginado con page y size (máximo 100).
        Requiere rol CLIENTE, OPERADOR, EDITOR_PLANTILLAS, ADMINISTRADOR_APLICACION o ADMINISTRADOR_PLATAFORMA.
      operationId: listTemplateBlocks
      x-status: planned
      x-allowed-roles: [CLIENTE, OPERADOR, EDITOR_PLANTILLAS, ADMINISTRADOR_APLICACION, ADMINISTRADOR_PLATAFORMA]
      parameters:
        - name: key
          in: query
          required: false
          schema:
            type: string
        - name: channel
          in: query
          required: false
          schema:
            type: string
        - name: language
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TemplateBlockStatus'
        - name: page
