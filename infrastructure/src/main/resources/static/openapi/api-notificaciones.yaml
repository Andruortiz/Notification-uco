      summary: Crear una plantilla
      description: >
        HU2-119. Crea una plantilla con variables {{nombre}} detectadas en asunto y cuerpo; lo no
        declarado es obligatorio. Única por (tenant, key, channel, language). El canal debe tener ruta
        activa para el tenant. Requiere rol EDITOR_PLANTILLAS o ADMINISTRADOR_PLATAFORMA.
      operationId: createTemplate
      x-status: available
      x-allowed-roles: [EDITOR_PLANTILLAS, ADMINISTRADOR_PLATAFORMA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplateRequest'
      responses:
        '201':
          headers:
