  /devices:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/TraceParent'
    post:
      tags: [Dispositivos]
      summary: Registrar un dispositivo push
      description: >
        HU2-120. Asocia un token de dispositivo a la identidad de la sesión. CLIENTE opera
        solo sobre su propia identidad; la lista de roles de esta operación no incluye administradores, así que un subject ajeno
        responde 403 hasta que Seguridad habilite roles por sesión. Registrar un token ya existente en el tenant lo deja asociado a la sesión y la
        respuesta no revela si era de otra identidad: 201 si se creó, 200 si ya existía para la sesión.
        Nunca responde 409. El token se almacena cifrado.
      operationId: registerDevice
      x-status: available
      x-allowed-roles: [CLIENTE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '201':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Dispositivo registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '200':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: El dispositivo ya estaba registrado para la sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/PepUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Dispositivos]
      summary: Listar los dispositivos registrados
      description: >
        HU2-120. Lista los dispositivos de la identidad de la sesión con el token enmascarado
        (**** y los últimos 4 caracteres). Un subject distinto del de la sesión responde 403 con la lista de roles actual.
      operationId: listDevices
      x-status: available
      x-allowed-roles: [CLIENTE]
      parameters:
        - name: subject
          in: query
          required: false
          description: Sujeto cuyos dispositivos se listan. Hoy solo el sujeto de la sesión; un valor distinto responde 403.
          schema:
            type: string
      responses:
        '200':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Dispositivos de la identidad (items vacío si no hay).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/PepUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

