openapi: 3.1.0
info:
  title: API de Notificaciones
  description: >
    API de Notification-uco. Cada endpoint corresponde a un caso de uso documentado.  Convención de nombramiento (versión 2):
    toda ruta es literal, sin `:` ni `{}`, para que el PDP la registre como recurso protegido por
    igualdad exacta de método y ruta. Los identificadores de recurso viajan en la query string
    (consultas) o en el cuerpo (comandos). Cada operación declara `x-status` (`available` si el
    servicio la sirve, `planned` si solo está documentada) y `x-minimum-role` (rol mínimo: `CLIENTE`,
    `OPERADOR` o `ADMINISTRADOR`, jerárquico). CU-03 (despachar) no
    tiene endpoint propio -- es un proceso interno disparado por el consumidor de RabbitMQ, nunca
    invocado directamente por un cliente. Autenticación (HU2-096): toda operación exige
    `Authorization: Bearer <JWT>` -- un token interino, emitido y firmado por este mismo servicio,
    con las claims `sub`, `tenantId` y `role` (`ADMINISTRADOR`, `OPERADOR` o `CLIENTE`, jerárquico).
    El tenant y el rol del solicitante salen siempre del token, nunca de un encabezado. Se
    reemplazará por la identidad resuelta contra la plataforma de Seguridad externa cuando DEP-01 se
    cierre, sin cambiar la forma de las claims. Con el PEP activo, la credencial puede ser también la
    cookie de sesión `SECURITY_BASELINE_SESSION` (HU2-101): el servicio resuelve tenant y usuario
    consultando la sesión a la plataforma de Seguridad, el rol efectivo es CLIENTE y el Bearer tiene
    precedencia sobre la cookie. El PEP puede responder 401, 403 o 503 con `PepErrorResponse` y la
    cabecera `X-Decision-Id`; si la plataforma de sesiones no responde, el servicio responde 503 con
    `ErrorResponse` (NTF-2003). GET /configuration (HU2-073) exige como mínimo
    el rol ADMINISTRADOR.

    Registro de cambios 2.0.0 (incompatible con 1.0.0, corte directo sin alias ni prefijo /v2):

    1. Ninguna ruta contiene `:` ni `{}`. Los identificadores van en la query string o en el cuerpo.
    2. Se retiran sin alias: `GET /notifications/{id}`, `GET /attachment-uploads/{uploadId}`,
    `POST /attachment-uploads/{uploadId}:complete`, `POST /notifications:sendBatch`,
    `GET /notifications:subscribe`, `POST /notifications:subscribeTicket`,
    `POST /notifications/{id}:retry`, `POST /channels:register`, `POST /providers:register`,
    `GET /recipients/{recipientId}/preferences`, `POST /recipients/{recipientId}:updatePreferences`.
    3. `POST /attachment-uploads` devuelve `Location: /attachment-uploads/status?uploadId=<id>`.
    4. La finalización de una subida y el reintento reciben el identificador en el cuerpo JSON.
    5. Las preferencias se actualizan con `PUT /recipients/preferences?recipientId=`.
    6. `SendNotificationResponse`, `NotificationStatusResponse`, `BatchItemResult`,
    `NotificationHistoryItem` y `DeliveryAttempt` declaran `required`.
    7. Se añade el esquema de seguridad `SessionCookie` y las respuestas 401, 403 y 503 del PEP con
    `X-Decision-Id`.
    8. Cada operación declara `x-status` y `x-minimum-role`.
    9. HU2-111, incompatible: se retira `POST /notifications/stream/tickets` y el parámetro `ticket`
    de `GET /notifications/stream`. El stream se autentica con Bearer o con la cookie de sesión.
    10. HU2-103: se declaran en `x-public-routes` las rutas de documentación que no exigen credencial
    (`security: []` para el PEP): `GET /openapi/api-notificaciones.yaml` y `GET /v3/api-docs` en todo
    entorno; `GET /v3/api-docs/swagger-config`, `GET /swagger-ui.html` y `GET /swagger-ui/**` solo
    fuera de producción. No son operaciones de `paths` ni recursos que haya que registrar en el PDP.

    Tabla de migración (método y ruta v1 a método y ruta v2):

    | v1 | v2 |
    |---|---|
    | POST /notifications | POST /notifications |
    | GET /notifications | GET /notifications |
    | POST /notifications:sendBatch | POST /notifications/batches |
    | GET /notifications/{id} | GET /notifications/detail?notificationId={id} |
    | POST /notifications/{id}:retry | POST /notification-retries (cuerpo notificationId; planned) |
    | GET /notifications:subscribe | GET /notifications/stream |
    | POST /notifications:subscribeTicket | retirado sin reemplazo (HU2-111); el stream usa Bearer o cookie |
    | POST /attachment-uploads | POST /attachment-uploads |
    | POST /attachment-uploads/{uploadId}:complete | POST /attachment-upload-completions (cuerpo uploadId) |
    | GET /attachment-uploads/{uploadId} | GET /attachment-uploads/status?uploadId={uploadId} |
    | GET /channels | GET /channels |
    | GET /providers | GET /providers |
    | GET /configuration | GET /configuration |
    | POST /channels:register | POST /channels (planned) |
    | POST /providers:register | POST /providers (planned) |
    | GET /recipients/{recipientId}/preferences | GET /recipients/preferences?recipientId={recipientId} (planned) |
    | POST /recipients/{recipientId}:updatePreferences | PUT /recipients/preferences?recipientId={recipientId} (planned) |
  version: 2.0.0
servers:
  - url: /
    description: >
      Relativo al host donde se sirve este contrato -- funciona igual en local, dev y prod sin
      editar este archivo cuando cambie el puerto o el dominio.

security:
  - BearerAuth: []
  - SessionCookie: []

x-public-routes:
  - method: GET
    path: /openapi/api-notificaciones.yaml
    exposure: always
    security: []
  - method: GET
    path: /v3/api-docs
    exposure: always
    security: []
  - method: GET
    path: /v3/api-docs/swagger-config
    exposure: non-production
    security: []
  - method: GET
    path: /swagger-ui.html
    exposure: non-production
    security: []
  - method: GET
    path: /swagger-ui/**
    exposure: non-production
    security: []

tags:
  - name: Notificaciones
    description: CU-01, CU-02, CU-04, CU-05, CU-06
  - name: Catálogo
    description: >
      CU-07, CU-08. La consulta (GET /channels, GET /providers) está disponible; el registro
      (POST /channels, POST /providers) sigue bloqueado.
  - name: Preferencias
    description: CU-09
  - name: Adjuntos
    description: >
      Subida de archivos de más de 1 MB al almacén del servicio para adjuntarlos a notificaciones.
      Los archivos de hasta 1 MB viajan embebidos en la propia notificación.
  - name: Configuración
    description: >
      CU-11 (lectura). GET /configuration expone los parámetros gestionables y la configuración en uso;
      exige el rol ADMINISTRADOR.

paths:
  /notifications:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/TraceParent'
    post:
      tags: [Notificaciones]
      summary: Enviar una notificación
      description: >
        CU-01. Acepta la notificación, la registra en estado PENDING y la encola para su despacho
        asíncrono. Si ya existe una notificación con el mismo (tenantId, externalId), devuelve esa
        misma notificación en vez de crear una segunda (idempotencia).
      operationId: sendNotification
      x-status: available
      x-minimum-role: CLIENTE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendNotificationRequest'
      responses:
        '202':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Notificación aceptada (nueva o duplicada -- ver el campo "duplicate").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendNotificationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: >
            El canal no existe/está deshabilitado, el contenido no cumple el esquema del canal, o un adjunto
            es inválido: el canal no acepta adjuntos; el adjunto incumple un tope del servicio (cantidad,
            tamaño, tamaño total, tipo, extensión) o una regla del canal; lleva content y url a la vez o
            ninguno; content no es Base64 válido o no coincide con sizeBytes; url no es una subida de este
            tenant o sus datos no coinciden; la subida está INFECTED; el tipo real no coincide con el
            declarado; o el archivo contiene software malicioso. El mensaje identifica el adjunto por su
            posición (attachments[i]) y la regla incumplida; nunca incluye el contenido ni la dirección.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: >
            Un adjunto referencia una subida todavía en PENDING_SCAN. Reintentar cuando
            GET /attachment-uploads/status?uploadId=... devuelva CLEAN. Una subida en FAILED se rechaza con 400.
            También responde 409 ante una modificación concurrente, una clave externalId ya aceptada o una
            transición de estado no permitida, con mensaje fijo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: El cuerpo de la solicitud supera 8 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            X-Decision-Id:
              $ref: '#/components/headers/DecisionId'
          description: >
            El antivirus o el almacén de archivos no están disponibles o no respondieron a tiempo. La
            notificación no se aceptó; puede reintentarse. Las notificaciones sin adjuntos no se ven
            afectadas. También lo devuelve el PEP (PEP_UNAVAILABLE) cuando no puede decidir el acceso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PepErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Notificaciones]
      summary: Consultar histórico y trazabilidad
      description: >
        CU-05. Busca notificaciones por filtros combinables. Cada resultado incluye su recorrido
        completo de intentos, no solo el estado actual (a diferencia de GET /notifications/detail, que
        solo exige rol CLIENTE). Requiere rol OPERADOR o ADMINISTRADOR.
      operationId: searchNotifications
      x-status: available
      x-minimum-role: OPERADOR
      parameters:
        - name: recipientId
          in: query
          schema:
            type: string
        - name: channelType
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/NotificationStatus'
        - name: from
          in: query
          description: Fecha/hora mínima de aceptación (inclusive).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Fecha/hora máxima de aceptación (inclusive).
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: Tamaño de página. Default 50, máximo 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          description: Posición inicial dentro del conjunto de resultados. Default 0.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Página de notificaciones que cumplen el criterio (items vacío si no hay resultados).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSearchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: >
            Parámetros inválidos -- from posterior a to, o limit/offset fuera de su rango válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/PepUnavailable'
  /notifications/stream:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/TraceParent'
    get:
      tags: [Notificaciones]
      summary: Suscribirse a actualizaciones en tiempo real
      description: >
        Historia "dashboard en tiempo real". Abre un stream Server-Sent Events: primero reproduce la
        foto vigente de las notificaciones del tenant que cumplen los filtros (equivalente a repetir
        GET /notifications sin paginar, acotado a 200 resultados), y luego continúa entregando cada
        cambio relevante mientras la conexión permanezca abierta. Una reconexión (ej. tras una caída
        de red) es, para el servidor, una solicitud nueva -- siempre reproduce la foto vigente antes
        de retomar el flujo en vivo, sin necesitar ningún encabezado ni parámetro de reanudación.
        Autenticación: con cabecera `Authorization: Bearer` o con la cookie de sesión
        `SECURITY_BASELINE_SESSION` (HU2-111), que un `EventSource` nativo envía con
        `withCredentials`. La credencial nunca viaja en la dirección de la conexión. Si llega la
        cabecera `Authorization`, tiene prioridad sobre la cookie. Sin credenciales, o con una
        sesión inválida, responde 401; si la plataforma de sesiones no responde, 503.
      operationId: subscribeToNotificationUpdates
      x-status: available
      x-minimum-role: CLIENTE
      parameters:
        - name: recipientId
          in: query
          schema:
            type: string
        - name: channelType
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/NotificationStatus'
        - name: from
          in: query
          description: Fecha/hora mínima de aceptación (inclusive). Mismo campo que en la búsqueda.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Fecha/hora máxima de aceptación (inclusive). Mismo campo que en la búsqueda.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: >
            Stream Server-Sent Events. Cada evento `data` es un `NotificationLiveUpdate`. La conexión
            permanece abierta hasta que el cliente la cierra; el servidor intercala comentarios de
            keep-alive periódicos.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/NotificationLiveUpdate'
        '401':
          description: >
            Sin credenciales, cabecera `Authorization` inválida o cookie de sesión inválida.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            X-Decision-Id:
              $ref: '#/components/headers/DecisionId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PepErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/PepUnavailable'

  /notifications/batches:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/TraceParent'
    post:
      tags: [Notificaciones]
      summary: Enviar un lote de notificaciones
      description: >
        Implementado. El lote es su propia unidad de seguimiento, no un bucle sobre POST
        /notifications -- cada elemento se valida e idempotiza por separado, y un elemento
        inválido no bloquea a los demás. Un elemento con un adjunto inválido, o que referencia una
        subida todavía en PENDING_SCAN, o rechazado por el catálogo (canal inexistente o
        deshabilitado, contenido que no cumple la forma del canal), se rechaza solo, con su motivo;
        los demás siguen. Un elemento que falla por un problema transitorio de infraestructura (por
        ejemplo el escaner de adjuntos no responde) queda como FAILED en vez de tumbar el lote
        completo; su motivo es siempre "Internal error". Los resultados vienen en el mismo orden de
        los elementos de la solicitud. Un lote admite hasta 500 elementos. Un reenvío con el mismo
        batchId del mismo tenant devuelve el resultado original solo si el registro del lote quedó
        guardado; si el guardado falló (trackingSaved=false) no hay registro y el reenvío vuelve a
        procesar los elementos (la deduplicación por externalId evita duplicar notificaciones).
      operationId: sendNotificationBatch
      x-status: available
      x-minimum-role: CLIENTE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendNotificationBatchRequest'
      responses:
        '202':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Lote aceptado -- ver el resultado individual de cada elemento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAcceptedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/PepUnavailable'
        '400':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: >
            La solicitud no cumple el esquema (lista de elementos vacía, ausente o con más de 500
            elementos, campo obligatorio ausente o vacío en algún elemento, prioridad desconocida,
            batchId en blanco). Se rechaza completa sin procesar ningún elemento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /notifications/detail:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/TraceParent'
    get:
      tags: [Notificaciones]
      summary: Consultar el estado de una notificación
      description: CU-04. Devuelve el estado actual, canal, proveedor y marca de tiempo del último intento.
      operationId: getNotificationStatus
      x-status: available
      x-minimum-role: CLIENTE
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Estado actual de la notificación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/PepUnavailable'
        '400':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: El parámetro notificationId falta o no es un identificador válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: >
            No existe una notificación con ese id, o no pertenece al tenant del solicitante --
            ambos casos responden igual, para no revelar si el id existe bajo otro cliente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /notification-retries:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/TraceParent'
    post:
      tags: [Notificaciones]
      summary: Reintentar el envío manualmente
      description: >
        CU-06. Solo válido si el estado actual es FAILED o RECOVERABLE. Reencola la notificación y
        registra el reintento como manual (distinto del automático) para efectos de auditoría.
        Requiere rol OPERADOR o ADMINISTRADOR. Planificada: sin controlador REST todavía (el mapeo de
        rol queda documentado para cuando exista).
      operationId: retryNotification
      x-status: planned
      x-minimum-role: OPERADOR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notificationId]
              properties:
                notificationId:
                  type: string
                  format: uuid
                  description: Identificador de la notificación que se reintenta.
      responses:
        '202':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Reintento aceptado, la notificación vuelve al flujo de despacho.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/PepUnavailable'
        '400':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: El estado actual no admite reintento (ej. ya está DELIVERED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: No existe una notificación con ese id para este tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /attachment-uploads:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/TraceParent'
    post:
      tags: [Adjuntos]
      summary: Pedir una dirección de subida para un archivo grande
      description: >
        Emite una política de subida firmada (formulario multipart por POST) para subir al almacén del
        servicio un archivo de más de 1 MB y hasta 10 MB. La subida nace en PENDING_SCAN. El cliente envía un
        POST multipart a uploadUrl con todos los campos de uploadFields y el campo "file" al final, antes de
        expiresAt; el almacén rechaza un archivo de tamaño distinto de sizeBytes o de un tipo distinto de
        contentType. Después avisa con POST /attachment-upload-completions y referencia el archivo
        en la notificación con attachmentUrl. uploadFields es una credencial temporal: solo aparece en esta
        respuesta.
      operationId: issueAttachmentUpload
      x-status: available
      x-minimum-role: CLIENTE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueAttachmentUploadRequest'
      responses:
        '201':
          description: Subida emitida.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Location:
              schema:
                type: string
              description: /attachment-uploads/status?uploadId=<uploadId>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentUploadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: >
            Nombre, tipo, extensión o tamaño inválidos, o tamaño de hasta 1 MB (ese archivo va embebido en
            la notificación).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            X-Decision-Id:
              $ref: '#/components/headers/DecisionId'
          description: >
            El almacén de archivos no está disponible. También lo devuelve el PEP (PEP_UNAVAILABLE)
            cuando no puede decidir el acceso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PepErrorResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /attachment-upload-completions:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/TraceParent'
    post:
      tags: [Adjuntos]
      summary: Avisar que la subida terminó
      description: >
        Comprueba que el archivo está en el almacén y que su tamaño coincide con el declarado, y encola
        su análisis. La subida sigue en PENDING_SCAN hasta que el análisis termina en CLEAN, INFECTED o
        FAILED. Si la subida ya está resuelta, o si otra llamada simultánea ganó la transición, devuelve su
        estado vigente sin volver a analizar. Si la subida ya venció, responde 409 y pasa a FAILED.
      operationId: completeAttachmentUpload
      x-status: available
      x-minimum-role: CLIENTE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uploadId]
              properties:
                uploadId:
                  type: string
                  description: Identificador de la subida emitida por POST /attachment-uploads.
      responses:
        '202':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Análisis encolado, o subida ya resuelta (ver state).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentUploadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: >
            El tamaño del archivo subido no coincide con el declarado. El archivo se descarta y la subida
            sigue en PENDING_SCAN: puede volver a subirse mientras la política de subida esté vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: La subida no existe para este tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: >
            El archivo todavía no está en el almacén, o la subida venció (pasa a FAILED con motivo
            EXPIRED y debe pedirse una nueva).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            X-Decision-Id:
              $ref: '#/components/headers/DecisionId'
          description: >
            El almacén de archivos o el broker no están disponibles. También lo devuelve el PEP
            (PEP_UNAVAILABLE) cuando no puede decidir el acceso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PepErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /attachment-uploads/status:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/TraceParent'
    get:
      tags: [Adjuntos]
      summary: Consultar el estado de una subida
      operationId: getAttachmentUpload
      x-status: available
      x-minimum-role: CLIENTE
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '200':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Estado actual. Nunca incluye uploadUrl.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentUploadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/PepUnavailable'
        '400':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: El parámetro uploadId falta o está en blanco.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: La subida no existe para este tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /channels:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/TraceParent'
    get:
      tags: [Catálogo]
      summary: Consultar los canales del catálogo y cómo se enrutan
      description: >
        CU-07 (lectura). Devuelve los canales que el enrutamiento está usando en este momento, cada uno
        con sus proveedores en orden de preferencia y el estado de cada proveedor. Hoy el despacho usa
        solo el proveedor en la posición 1; los demás se listan en su orden pero no se usan como
        respaldo automático. El catálogo es del despliegue, no del tenant: la respuesta es la misma
        para cualquier identidad autenticada. Un cambio guardado en el catálogo aparece aquí en el
        mismo refresco en que el enrutamiento empieza a usarlo. Ningún campo contiene el valor de una
        credencial.
      operationId: listChannels
      x-status: available
      x-minimum-role: CLIENTE
      responses:
        '200':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Canales ordenados por channelType (items vacío si el catálogo está vacío).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelCatalogResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/PepUnavailable'
    post:
      tags: [Catálogo]
      summary: Registrar o actualizar un canal
      description: >
        CU-07. Requiere permiso de ADMINISTRADOR. Da de alta el canal en el catálogo, sin
        desplegar código (RF-19). Si el canal ya existe, esta misma operación lo actualiza.
        Bloqueado: el catálogo dinámico ya existe, pero su escritura por API aún no está
        habilitada.
      operationId: registerChannel
      x-status: planned
      x-minimum-role: ADMINISTRADOR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterChannelRequest'
      responses:
        '200':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Canal registrado o actualizado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/PepUnavailable'
        '400':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: El esquema de validación del canal está mal formado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /providers:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/TraceParent'
    get:
      tags: [Catálogo]
      summary: Consultar los proveedores, su estado y dónde se usan
      description: >
        CU-08 (lectura). Devuelve la unión de los proveedores con adaptador en este despliegue y los que
        nombra el catálogo, cada uno con su estado y los canales en que aparece. MISSING_ADAPTER indica
        que el catálogo nombra un proveedor para el que el despliegue no tiene adaptador. El estado de
        habilitación es el de configuración de la réplica que responde, no la salud actual del
        proveedor. Misma respuesta para cualquier identidad autenticada; ningún campo contiene el
        valor de una credencial.
      operationId: listProviders
      x-status: available
      x-minimum-role: CLIENTE
      responses:
        '200':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Proveedores ordenados por providerId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCatalogResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/PepUnavailable'
    post:
      tags: [Catálogo]
      summary: Registrar un proveedor para uno o más canales
      description: >
        CU-08. Requiere permiso de ADMINISTRADOR y que el adaptador del proveedor ya exista en el
        código (no puede registrarse un providerId sin adaptador). Si falta una credencial
        requerida, el proveedor queda registrado pero deshabilitado -- nunca a medias en silencio.
        Bloqueado hasta que exista el catálogo dinámico (Fase 6).
      operationId: registerProvider
      x-status: planned
      x-minimum-role: ADMINISTRADOR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterProviderRequest'
      responses:
        '201':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Proveedor registrado -- ver el campo "enabled" si faltó alguna credencial.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterProviderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/PepUnavailable'
        '404':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: No existe un adaptador de código para ese providerId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /configuration:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/TraceParent'
    get:
      tags: [Configuración]
      summary: Consultar los parámetros gestionables y la configuración en uso
      description: >
        CU-11 (lectura). Requiere permiso de ADMINISTRADOR. Devuelve el registro de parámetros que el
        servicio permite gestionar y, para la réplica que responde, la versión de la configuración en uso,
        su origen y las claves aceptadas que esperan un reinicio. Ningún campo contiene credenciales,
        topología de colas ni direcciones base.
      operationId: getConfiguration
      x-status: available
      x-minimum-role: ADMINISTRADOR
      responses:
        '200':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Configuración en uso de la réplica y registro de parámetros.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/PepUnavailable'
  /recipients/preferences:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/TraceParent'
      - $ref: '#/components/parameters/RecipientId'
    get:
      tags: [Preferencias]
      summary: Consultar las preferencias de un destinatario
      description: >
        CU-09. Devuelve las preferencias vigentes del destinatario dentro del tenant del encabezado.
        Un destinatario que nunca declaró preferencias no es un error: se devuelve el valor por
        defecto (optedOutAll false, acceptedChannels vacía -- todos los canales aceptados -- y
        updatedAt nulo). Las preferencias de un tenant nunca son visibles desde otro, aunque usen el
        mismo recipientId. Requiere rol CLIENTE o superior. Planificada: sin controlador REST todavía
        (el mapeo de rol queda documentado para cuando exista).
      operationId: getRecipientPreferences
      x-status: planned
      x-minimum-role: CLIENTE
      responses:
        '200':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Preferencias vigentes (por defecto, todos los canales aceptados).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipientPreferencesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/PepUnavailable'
    put:
      tags: [Preferencias]
      summary: Actualizar las preferencias de un destinatario
      description: >
        CU-09. Reemplaza por completo las preferencias del destinatario dentro del tenant del
        encabezado: por qué canales acepta ser contactado, o su baja total (optedOutAll). Desde el
        siguiente despacho -- incluidas las notificaciones ya aceptadas que aún no se enviaron y los
        reintentos --, una notificación de ese destinatario termina en DISCARDED sin contactar a
        ningún proveedor si está dado de baja o si su canal no está entre los aceptados. La aceptación
        de notificaciones no cambia, y las notificaciones ya terminales no se modifican. Requiere rol
        CLIENTE o superior. Planificada: sin controlador REST todavía (el mapeo de rol queda
        documentado para cuando exista).
      operationId: updateRecipientPreferences
      x-status: planned
      x-minimum-role: CLIENTE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferencesRequest'
      responses:
        '200':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Preferencias actualizadas, tal como quedaron guardadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipientPreferencesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/PepUnavailable'
        '400':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: >
            Cuerpo ausente o una entrada de acceptedChannels vacía o solo con espacios. Las
            preferencias vigentes no cambian.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  headers:
    CorrelationId:
      description: Identificador de correlación de la petición (el recibido si es válido, o uno generado).
      schema:
        type: string
        maxLength: 64
        pattern: '^[A-Za-z0-9._-]{1,64}$'
    DecisionId:
      description: >
        Identificador de la decisión del PEP que autorizó o rechazó la solicitud. Presente cuando el
        PEP responde.
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token interino emitido y firmado por este mismo servicio (HS256), con las claims sub,
        tenantId y role. Se reemplazará por la identidad resuelta contra la plataforma de Seguridad
        externa cuando DEP-01 se cierre -- la forma de las claims es la misma que usará el adaptador
        definitivo.
    SessionCookie:
      type: apiKey
      in: cookie
      name: SECURITY_BASELINE_SESSION
      description: >
        Cookie de sesión de la plataforma de Seguridad. El servicio la acepta como alternativa al
        Bearer solo con el PEP activo: resuelve la identidad consultando la sesión a la plataforma
        y el PEP la valida y autoriza la ruta. Si la petición trae Authorization, manda el Bearer y,
        si es inválido, responde 401 sin probar la cookie. El rol efectivo de la sesión es CLIENTE.

  responses:
    Unauthorized:
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        X-Decision-Id:
          $ref: '#/components/headers/DecisionId'
      description: >
        Sin credencial, credencial mal formada, firma inválida, expirada, o con alguna claim
        obligatoria (sub, tenantId, role) ausente o con role fuera de ADMINISTRADOR/OPERADOR/CLIENTE.
        También cuando la cookie de sesión es inválida, expirada o revocada. Responde ErrorResponse
        (NTF-2001) cuando lo rechaza el servicio, con Bearer o con cookie; con el PEP activo puede
        responder PepErrorResponse con code TOKEN_INVALID. El cuerpo nunca detalla la causa
        criptográfica exacta del rechazo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PepErrorResponse'
    Forbidden:
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        X-Decision-Id:
          $ref: '#/components/headers/DecisionId'
      description: >
        Credencial válida, pero el rol no alcanza el mínimo requerido por esta operación. Con el modo
        interino responde ErrorResponse (NTF-2002); con el PEP activo responde PepErrorResponse con
        code ACCESS_DENIED.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PepErrorResponse'
    PepUnavailable:
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        X-Decision-Id:
          $ref: '#/components/headers/DecisionId'
      description: >
        El PEP no pudo decidir el acceso (PEP_UNAVAILABLE) o la plataforma de sesiones no respondió
        a tiempo al resolver la cookie de sesión (ErrorResponse, NTF-2003). La solicitud no llegó a
        ejecutarse y puede reintentarse.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PepErrorResponse'
    Conflict:
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      description: >
        Conflicto con el estado actual del recurso: modificación concurrente de la notificación,
        clave externalId ya aceptada para el tenant o transición de estado no permitida. El mensaje es
        fijo y no incluye datos de otros recursos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      description: >
        Error inesperado. El cuerpo lleva un mensaje genérico y el correlationId para localizar la causa
        en los logs; nunca el mensaje interno de la excepción.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: >
        Identificador de correlación de la petición, de 1 a 64 caracteres (letras, dígitos, punto,
        guion y guion bajo). Si falta o es inválido, el servicio genera uno. Siempre se devuelve en
        el header de respuesta del mismo nombre y viaja hasta el despacho al proveedor.
      schema:
        type: string
        maxLength: 64
        pattern: '^[A-Za-z0-9._-]{1,64}$'
    TraceParent:
      name: traceparent
      in: header
      required: false
      description: >
        Cabecera de contexto de traza W3C. Si cumple el formato, el servicio continúa esa traza en
        sus tramos, logs y mensajería; si no cumple se descarta y se inicia una traza nueva. El
        servicio no la devuelve en la respuesta.
      schema:
        type: string
        pattern: '^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
    NotificationId:
      name: notificationId
      in: query
      required: true
      description: Identificador de la notificación.
      schema:
        type: string
        format: uuid
    RecipientId:
      name: recipientId
      in: query
      required: true
      description: Identificador del destinatario, estable entre canales. Se codifica como porcentaje en la query.
      schema:
        type: string
    UploadId:
      name: uploadId
      in: query
      required: true
      description: Identificador de la subida emitida por POST /attachment-uploads.
      schema:
        type: string

  schemas:
    SendNotificationRequest:
      type: object
      required:
        - externalId
        - channelType
        - recipientId
        - recipientAddress
        - priority
      properties:
        externalId:
          type: string
          description: Identificador propio del sistema cliente, usado para idempotencia.
          example: order-42
        channelType:
          type: string
          description: >
            Canal registrado en el catálogo. La configuración por defecto declara EMAIL, SMS, PUSH y
            WHATSAPP.
          example: EMAIL
        recipientId:
          type: string
          description: Identificador del destinatario, estable entre canales.
          example: recipient-1
        recipientAddress:
          type: string
          description: >
            Dirección concreta del canal usado en este envío (email, teléfono, etc.). En SMS es un
            número en formato internacional (signo +, código de país y número, ej. +573001234567); un
            número sin ese formato termina en FAILED sin enviarse. En PUSH es el identificador de
            dispositivo que el proveedor de push emitió a la aplicación cliente (ej. device-token-demo-1234);
            se trata como texto opaco y no se valida su forma: un identificador inválido o caducado termina
            en FAILED sin reintentos. En WHATSAPP es un número en formato internacional (ej.
            +573001234567); un número sin ese formato, o sin cuenta de WhatsApp, termina en FAILED sin
            reintentos.
          example: alice@example.com
        subject:
          type: string
          nullable: true
          description: >
            Opcional -- algunos canales (ej. SMS) no lo usan. En SMS se admite y se ignora: no se
            envía ni se antepone al cuerpo. En PUSH es el título visible, opcional, de hasta 100
            caracteres. En WHATSAPP se admite y se ignora.
          example: Bienvenida
        body:
          type: string
          nullable: true
          description: >
            Cuerpo de la notificación. Obligatorio salvo que se envíe providerTemplate; no puede
            enviarse junto con providerTemplate. La longitud máxima la fija la forma de contenido del
            canal en el catálogo; en SMS son 160 caracteres, en PUSH 900 y en WHATSAPP 1600 por defecto.
            Un contenido más largo se rechaza con 400 y nunca se trunca.
          example: Hola Alice, tu pedido fue confirmado.
        providerTemplate:
          type: object
          nullable: true
          required: [templateId]
          description: >
            Opcional. Envía una plantilla aprobada por el proveedor en lugar de un cuerpo libre;
            excluyente con body. El canal debe declararla en su forma de contenido (GET /channels,
            contentSchema, propiedad providerTemplate); con la configuración por defecto solo WHATSAPP
            lo hace y cualquier otro canal rechaza la notificación con 400. Fuera de la ventana de 24 h
            de WhatsApp solo se admiten plantillas; un texto libre que el proveedor rechaza por estar
            fuera de la ventana termina en FAILED sin reintentos. El servicio valida la forma
            (referencia presente, a lo sumo 20 variables de hasta 1024 caracteres); que la plantilla
            exista y esté aprobada, y que no falte ninguna de sus variables, lo decide el proveedor al
            enviar y un rechazo termina en FAILED.
          properties:
            templateId:
              type: string
              maxLength: 64
              description: Identificador de la plantilla aprobada ante el proveedor.
              example: HXb5b62575e6e4ff6129ad7c8efe1f983e
            variables:
              type: object
              additionalProperties:
                type: string
                maxLength: 1024
              description: Valores de las variables de la plantilla, por nombre.
              example: { "1": "Alice", "2": "42" }
        priority:
          $ref: '#/components/schemas/Priority'
        attachments:
          type: array
          nullable: true
          maxItems: 5
          description: >
            Opcional. Archivos que acompañan la notificación, en el orden en que se entregarán. El canal
            debe declararlos en su forma de contenido (ver GET /channels, campo contentSchema, propiedad
            attachments); un canal que no los declara rechaza toda notificación con adjuntos. Con la
            configuración por defecto ningún canal los declara (tampoco WHATSAPP). Cada adjunto lleva exactamente uno de
            content (archivo de hasta 1 MB codificado en Base64) o url (archivo de más de 1 MB subido antes
            con POST /attachment-uploads y en estado CLEAN). A lo sumo 5 adjuntos y 25 MB (26214400 bytes)
            en total. El servicio verifica el tipo real de cada archivo y lo analiza con un antivirus. Una
            notificación con un adjunto inválido se rechaza completa; nunca se acepta sin el adjunto. Si el
            proveedor que la despacha no sabe enviar adjuntos, termina en FAILED sin enviarse.
          items:
            $ref: '#/components/schemas/Attachment'

    Attachment:
      type: object
      required: [fileName, contentType, sizeBytes]
      oneOf:
        - required: [content]
          not:
            required: [url]
        - required: [url]
          not:
            required: [content]
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          description: >
            Nombre con el que lo verá el destinatario. Sin separadores de ruta ni caracteres de control;
            distinto de "." y "..". No puede terminar en una extensión prohibida (sin distinguir
            mayúsculas, ignorando puntos y espacios finales): .exe .msi .bat .cmd .com .scr .pif .vbs .vbe
            .js .jse .wsf .wsh .ps1 .hta .cpl .msc .reg .lnk .jar .dll .sh .apk .app .gadget .com.pif .msix
            .war.
          example: factura-0042.pdf
        contentType:
          type: string
          description: >
            Tipo de medio. Se compara en minúsculas y sin parámetros, y debe coincidir con el tipo real
            del contenido. Tipos admitidos por el servicio: application/pdf, image/png, image/jpeg,
            text/plain, text/csv,
            application/vnd.openxmlformats-officedocument.wordprocessingml.document,
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet. Cada canal puede admitir
            menos.
          example: application/pdf
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 10485760
          description: >
            Tamaño real en bytes. Hasta 1048576 va en content; de 1048577 a 10485760, en url. Con content
            debe ser igual al tamaño decodificado; con url, igual al de la subida. Cada canal puede fijar
            menos. Límite inclusivo.
          example: 183422
        content:
          type: string
          format: byte
          description: >
            Archivo de hasta 1 MB codificado en Base64 estándar (RFC 4648, con relleno), sin prefijo
            "data:" ni saltos de línea. Dato sensible: nunca aparece en respuestas, registros ni eventos.
        url:
          type: string
          format: uri
          maxLength: 2048
          description: >
            attachmentUrl devuelta por POST /attachment-uploads para el mismo tenant, cuya subida está en
            estado CLEAN. Cualquier otra dirección se rechaza; el servicio no la descarga. La parte de
            consulta se ignora y la dirección no se guarda.

    IssueAttachmentUploadRequest:
      type: object
      required: [fileName, contentType, sizeBytes]
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          description: Mismas reglas que Attachment.fileName.
          example: contrato-2026.pdf
        contentType:
          type: string
          description: Mismos tipos que Attachment.contentType.
          example: application/pdf
        sizeBytes:
          type: integer
          format: int64
          minimum: 1048577
          maximum: 10485760
          description: Tamaño exacto del archivo que se subirá.
          example: 5242880

    AttachmentUploadState:
      type: string
      enum: [PENDING_SCAN, CLEAN, INFECTED, FAILED]

    AttachmentUploadResponse:
      type: object
      required: [uploadId, state, fileName, contentType, sizeBytes]
      properties:
        uploadId:
          type: string
        state:
          $ref: '#/components/schemas/AttachmentUploadState'
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        sha256:
          type: string
          nullable: true
          description: Huella SHA-256 en hexadecimal, desde que termina el análisis.
        rejectionReason:
          type: string
          nullable: true
          enum: [MALWARE, CONTENT_TYPE_MISMATCH, OBJECT_MISSING, SIZE_MISMATCH, SCAN_EXHAUSTED, EXPIRED]
          description: Solo en INFECTED (MALWARE, CONTENT_TYPE_MISMATCH) y en FAILED (los demás).
        uploadUrl:
          type: string
          format: uri
          nullable: true
          description: Destino del formulario multipart. Solo en la respuesta de POST /attachment-uploads.
        uploadFields:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: >
            Campos firmados del formulario multipart (política con tamaño exacto y tipo declarado). Solo en
            la respuesta de POST /attachment-uploads. Credencial temporal.
        attachmentUrl:
          type: string
          format: uri
          nullable: true
          description: >
            Dirección con la que una notificación referencia este archivo (Attachment.url). Solo en la
            respuesta de POST /attachment-uploads. No contiene firma.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Vencimiento de la política de subida. Solo en la respuesta de POST /attachment-uploads.

    SendNotificationResponse:
      type: object
      required: [notificationId, status, duplicate]
      properties:
        notificationId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/NotificationStatus'
        duplicate:
          type: boolean
          description: true si ya existía una notificación con el mismo (tenantId, externalId).

    SendNotificationBatchRequest:
      type: object
      required:
        - items
      properties:
        batchId:
          type: string
          nullable: true
          description: Opcional -- si no se envía, el componente genera uno.
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/SendNotificationRequest'

    BatchAcceptedResponse:
      type: object
      required:
        - batchId
        - results
        - trackingSaved
      properties:
        batchId:
          type: string
        trackingSaved:
          type: boolean
          description: >
            true si el registro del lote quedó guardado o ya existía; false si el guardado falló y
            el seguimiento del lote no está disponible.
        results:
          type: array
          items:
            $ref: '#/components/schemas/BatchItemResult'

    BatchItemResult:
      type: object
      required: [externalId, outcome, notificationId, rejectionReason]
      properties:
        externalId:
          type: string
        outcome:
          type: string
          enum: [ACCEPTED, DUPLICATE, REJECTED, FAILED]
          description: >
            REJECTED es un rechazo de negocio (canal, contenido o adjunto invalido). FAILED es un
            problema transitorio de infraestructura (por ejemplo el escaner de adjuntos no responde);
            el cliente puede reintentar ese elemento.
        notificationId:
          type: [string, 'null']
          format: uuid
          description: Nulo cuando outcome es REJECTED o FAILED.
        rejectionReason:
          type: [string, 'null']
          description: >
            Solo presente cuando outcome es REJECTED o FAILED. Para FAILED el valor es siempre
            "Internal error"; los rechazos de negocio conservan su texto.

    NotificationStatusResponse:
      type: object
      required: [notificationId, status, channelType, providerId, lastUpdatedAt, correlationId]
      properties:
        notificationId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/NotificationStatus'
        channelType:
          type: string
        providerId:
          type: [string, 'null']
          description: Proveedor del último intento de envío. Nulo si aún no se ha intentado despachar.
        lastUpdatedAt:
          type: string
          format: date-time
        correlationId:
          type: [string, 'null']
          maxLength: 64
          description: >
            Identificador de correlación con el que se aceptó la notificación. Nulo en notificaciones
            anteriores a la introducción del identificador.

    NotificationSearchResponse:
      type: object
      required: [items, limit, offset, hasNext]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationHistoryItem'
        limit:
          type: integer
          description: Tamaño de página efectivamente aplicado.
        offset:
          type: integer
          description: Offset efectivamente aplicado.
        hasNext:
          type: boolean
          description: true si existen más resultados después de esta página.

    NotificationHistoryItem:
      type: object
      required:
        [notificationId, externalId, recipientId, channelType, status, acceptedAt, deliveryAttempts]
      properties:
        notificationId:
          type: string
          format: uuid
        externalId:
          type: string
        recipientId:
          type: string
        channelType:
          type: string
        status:
          $ref: '#/components/schemas/NotificationStatus'
        acceptedAt:
          type: string
          format: date-time
        deliveryAttempts:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryAttempt'

    DeliveryAttempt:
      type: object
      required: [occurredOn, result, origin, providerId]
      properties:
        occurredOn:
          type: string
          format: date-time
        result:
          type: string
          enum: [ACCEPTED, RECOVERABLE_FAILURE, PERMANENT_FAILURE]
        origin:
          type: string
          enum: [MANUAL, AUTOMATIC]
        providerId:
          type: string

    RegisterChannelRequest:
      type: object
      required:
        - channelType
      properties:
        channelType:
          type: string
          example: SMS
        contentSchema:
          type: string
          nullable: true
          description: >
            Esquema JSON Schema (como string) contra el que se valida el contenido enviado por este canal.
            Además del largo de subject y body, puede declarar adjuntos con una propiedad "attachments" de
            tipo arreglo: maxItems (cantidad), items.properties.contentType.enum (tipos, en minúsculas) e
            items.properties.sizeBytes.maximum (bytes). Un canal sin esa propiedad no acepta adjuntos.
        maxRetryAttempts:
          type: integer
          nullable: true
          description: Tope de reintentos automáticos para este canal. Nulo usa el default global.

    RegisterProviderRequest:
      type: object
      required:
        - providerId
        - channels
      properties:
        providerId:
          type: string
          example: brevo
        channels:
          type: array
          minItems: 1
          items:
            type: object
            required: [channelType, preferenceOrder]
            properties:
              channelType:
                type: string
              preferenceOrder:
                type: integer
                description: Orden de preferencia dentro del canal (1 = preferente).

    RegisterProviderResponse:
      type: object
      properties:
        providerId:
          type: string
        enabled:
          type: boolean
          description: false si falta alguna credencial requerida por este proveedor.
        missingCredentials:
          type: array
          items:
            type: string
          description: Vacío cuando enabled es true.

    RecipientPreferencesResponse:
      type: object
      required: [recipientId, optedOutAll, acceptedChannels]
      properties:
        recipientId:
          type: string
        optedOutAll:
          type: boolean
        acceptedChannels:
          type: array
          items:
            type: string
          description: >
            Canales aceptados, en mayúsculas y sin duplicados. Vacía significa sin restricción (todos
            los canales aceptados). Siempre vacía si optedOutAll es true.
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Nulo si el destinatario nunca declaró preferencias en este tenant.

    UpdatePreferencesRequest:
      type: object
      properties:
        optedOutAll:
          type: boolean
          default: false
        acceptedChannels:
          type: array
          items:
            type: string
          description: >
            Vacía o ausente significa que acepta todos los canales. Cada entrada se normaliza (sin
            espacios alrededor, en mayúsculas, sin duplicados); una entrada vacía rechaza la
            actualización con 400. Ignorada si optedOutAll es true.

    ProviderStatus:
      type: string
      enum: [ENABLED, DISABLED, MISSING_ADAPTER]
      description: >
        ENABLED: tiene adaptador y su configuración está completa. DISABLED: tiene adaptador pero le falta
        o tiene mal formada una credencial (ver statusReason). MISSING_ADAPTER: el catálogo lo nombra pero
        el despliegue no tiene adaptador para él.

    ChannelCatalogResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChannelItem'

    ChannelItem:
      type: object
      required: [channelType, contentSchema, providers]
      properties:
        channelType:
          type: string
          example: EMAIL
        contentSchema:
          type: string
          nullable: true
          description: >
            Forma de contenido (JSON Schema como texto) tal como está guardada. Nulo si el canal no declara
            ninguna. Además del largo de subject y body, puede declarar adjuntos con una propiedad
            "attachments" de tipo arreglo: maxItems (cantidad), items.properties.contentType.enum (tipos,
            en minúsculas) e items.properties.sizeBytes.maximum (bytes). Un canal sin esa propiedad no
            acepta adjuntos.
        providers:
          type: array
          minItems: 1
          description: En orden de preferencia.
          items:
            $ref: '#/components/schemas/ChannelProviderItem'

    ChannelProviderItem:
      type: object
      required: [providerId, preferenceOrder, status, statusReason]
      properties:
        providerId:
          type: string
          example: simulated
        preferenceOrder:
          type: integer
          minimum: 1
          description: 1 = preferente, el único que usa hoy el despacho.
        status:
          $ref: '#/components/schemas/ProviderStatus'
        statusReason:
          type: string
          nullable: true
          description: Nulo cuando status es ENABLED. Nombra la configuración ausente o mal formada, nunca su valor.
          example: missing notification.provider.twilio.account-sid (TWILIO_ACCOUNT_SID)

    ConfigurationResponse:
      type: object
      required: [version, source, adoptedAt, pendingRestart, parameters]
      properties:
        version:
          type: integer
          format: int64
          description: Versión asignada por el Componente de Parámetros; 0 para los valores por defecto.
        source:
          type: string
          enum: [PARAMETERS, LAST_KNOWN, DEFAULTS]
        adoptedAt:
          type: string
          format: date-time
        pendingRestart:
          type: array
          items:
            type: string
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/ParameterDescriptorResponse'

    ParameterDescriptorResponse:
      type: object
      required: [key, type, defaultValue, currentValue, min, max, scope, adoption]
      properties:
        key:
          type: string
          example: provider.brevo.timeout-ms
        type:
          type: string
          enum: [INTEGER]
        defaultValue:
          type: integer
          format: int64
        currentValue:
          type: integer
          format: int64
        min:
          type: integer
          format: int64
        max:
          type: integer
          format: int64
        scope:
          type: string
          enum: [GLOBAL, CHANNEL, PROVIDER]
        scopeIds:
          type: array
          items:
            type: string
        adoption:
          type: string
          enum: [HOT, RESTART]
    ProviderCatalogResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProviderItem'

    ProviderItem:
      type: object
      required: [providerId, status, statusReason, channels]
      properties:
        providerId:
          type: string
          example: twilio
        status:
          $ref: '#/components/schemas/ProviderStatus'
        statusReason:
          type: string
          nullable: true
          description: Nulo cuando status es ENABLED. Nombra la configuración ausente o mal formada, nunca su valor.
        channels:
          type: array
          description: Canales que nombran a este proveedor, con su posición en cada uno. Vacío si ninguno.
          items:
            type: object
            required: [channelType, preferenceOrder]
            properties:
              channelType:
                type: string
              preferenceOrder:
                type: integer
                minimum: 1

    ErrorResponse:
      type: object
      required:
        - code
        - correlationId
      properties:
        code:
          type: string
          description: Código estable del error, con formato NTF-<número>; el prefijo del número indica la categoría (1 validación, 2 autenticación y autorización, 3 negocio, 4 proveedor, 5 infraestructura).
          enum:
            - NTF-1001
            - NTF-1002
            - NTF-1003
            - NTF-1004
            - NTF-1005
            - NTF-2001
            - NTF-2002
            - NTF-2003
            - NTF-3000
            - NTF-3001
            - NTF-3002
            - NTF-3003
            - NTF-3004
            - NTF-3005
            - NTF-3006
            - NTF-3007
            - NTF-3008
            - NTF-3010
            - NTF-3011
            - NTF-3012
            - NTF-3020
            - NTF-3021
            - NTF-3030
            - NTF-4000
            - NTF-4002
            - NTF-4010
            - NTF-4011
            - NTF-4012
            - NTF-4020
            - NTF-4021
            - NTF-5000
            - NTF-5001
            - NTF-5002
            - NTF-5003
            - NTF-5004
            - NTF-5005
            - NTF-5006
            - NTF-5007
            - NTF-5010
            - NTF-5020
            - NTF-5021
            - NTF-5022
            - NTF-5030
            - NTF-5040
            - NTF-5050
            - NTF-5060
        message:
          type: string
        correlationId:
          type: string
          maxLength: 64
          description: Identificador de correlación de la petición que produjo el error.

    PepErrorResponse:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          format: uri
          description: Siempre urn:security-pep:error:<code en minúsculas>.
          example: urn:security-pep:error:access_denied
        title:
          type: string
          description: Igual a code.
        status:
          type: integer
          enum: [401, 403, 503]
        detail:
          type: string
          description: Texto estándar del estado HTTP.
          example: Forbidden
        code:
          type: string
          enum: [TOKEN_INVALID, ACCESS_DENIED, PEP_UNAVAILABLE]
          description: TOKEN_INVALID acompaña al 401, ACCESS_DENIED al 403 y PEP_UNAVAILABLE al 503.

    Priority:
      type: string
      enum: [LOW, NORMAL, HIGH]

    NotificationStatus:
      type: string
      enum: [PENDING, IN_PROCESS, DELIVERED, RECOVERABLE, FAILED, DISCARDED]

    NotificationLiveUpdate:
      type: object
      properties:
        action:
          type: string
          enum: [UPSERT, REMOVE]
          description: >
            UPSERT: la notificación cumple los filtros activos, el dashboard debe mostrarla/actualizarla.
            REMOVE: dejó de cumplirlos, el dashboard debe quitarla de la vista visible.
        notification:
          $ref: '#/components/schemas/NotificationHistoryItem'
      required:
        - action
        - notification
