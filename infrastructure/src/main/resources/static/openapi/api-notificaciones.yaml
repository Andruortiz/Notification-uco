    post:
      tags: [Plantillas]
      summary: Renderizar una plantilla
      description: >
        HU2-119. Sustituye las variables en una sola pasada y devuelve texto plano sin escapar; los
        valores se tratan como texto literal y no se persisten ni se registran. Si falta alguna variable
        obligatoria responde 422 con la lista completa en missingVariables.
      operationId: renderTemplate
      x-status: available
      x-allowed-roles: [CLIENTE, EDITOR_PLANTILLAS, ADMINISTRADOR_APLICACION, ADMINISTRADOR_PLATAFORMA]
      requestBody:
