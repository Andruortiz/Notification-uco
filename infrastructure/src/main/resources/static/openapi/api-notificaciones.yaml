      responses:
        '200':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Estado de la marca para la dirección (marked es false si no existe).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UndeliverableRecipientResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/PepUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /recipients/undeliverable-releases:
