components:
  headers:
    CorrelationId:
      description: Identificador de correlación de la petición (el recibido si es válido, o uno generado).
      schema:
        type: string
        maxLength: 64
        pattern: '^[A-Za-z0-9._-]{1,64}$'
    DecisionId:
      description: >
        Identificador de la decisión del PEP que autorizó o rechazó la solicitud. Presente cuando el
        PEP responde.
      schema:
        type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT firmado por la plataforma de Seguridad y validado con su clave pública. Claims esperadas:
        sub (sujeto), tenantId, role (lista de roles de los seis conocidos) y exp; la claim del cliente
        de plataforma (azp por defecto) es opcional. El tenant y el rol salen siempre del token: no se
        acepta el encabezado X-Tenant-Id ni ningún otro mecanismo de identidad. Una claim obligatoria
        ausente responde 401 con NTF-2004; cualquier otro rechazo, 401 con NTF-2001.
    SessionCookie:
      type: apiKey
      in: cookie
      name: SECURITY_BASELINE_SESSION
      description: >
        Cookie de sesión de la plataforma de Seguridad. El servicio la acepta como alternativa al
        Bearer solo con el PEP activo: resuelve la identidad consultando la sesión a la plataforma
        y el PEP la valida y autoriza la ruta. Si la petición trae Authorization, manda el Bearer y,
        si es inválido, responde 401 sin probar la cookie. El rol efectivo de la sesión es CLIENTE.

  responses:
    Unauthorized:
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        X-Decision-Id:
          $ref: '#/components/headers/DecisionId'
      description: >
        Sin credencial, credencial mal formada, firma inválida, emisor o audiencia incorrectos, o
        expirada: ErrorResponse con NTF-2001. Con alguna claim obligatoria (sub, tenantId, role, exp)
        ausente o con role fuera de uno de los seis roles conocidos: ErrorResponse con NTF-2004.
        También cuando la cookie de sesión es inválida, expirada o revocada (NTF-2001). Con el PEP
        activo puede responder PepErrorResponse con code TOKEN_INVALID. El cuerpo nunca detalla la
        causa criptográfica exacta del rechazo ni incluye valores del token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PepErrorResponse'
    Forbidden:
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        X-Decision-Id:
          $ref: '#/components/headers/DecisionId'
      description: >
        Credencial válida, pero ninguno de sus roles está en la lista permitida de esta operación. Con el modo
        interino responde ErrorResponse (NTF-2002); con el PEP activo responde PepErrorResponse con
        code ACCESS_DENIED.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PepErrorResponse'
    PepUnavailable:
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        X-Decision-Id:
          $ref: '#/components/headers/DecisionId'
      description: >
        El PEP no pudo decidir el acceso (PEP_UNAVAILABLE) o la plataforma de sesiones no respondió
        a tiempo al resolver la cookie de sesión (ErrorResponse, NTF-2003). La solicitud no llegó a
        ejecutarse y puede reintentarse.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PepErrorResponse'
    Conflict:
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      description: >
        Conflicto con el estado actual del recurso: modificación concurrente de la notificación,
        clave externalId ya aceptada para el tenant, transición de estado no permitida, reenvío ya
        realizado por ese canal, destinatario marcado como no entregable (NTF-3040) o, en plantillas,
        duplicado (NTF-3051), versión desfasada (NTF-3052) o plantilla archivada (NTF-3053). El mensaje
        es fijo y no incluye datos de otros recursos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      description: >
        Error inesperado. El cuerpo lleva un mensaje genérico y el correlationId para localizar la causa
        en los logs; nunca el mensaje interno de la excepción.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      description: >
        Solicitud inválida: cuerpo o parámetros mal formados, valores fuera de rango o regla de
        negocio incumplida. El campo code de ErrorResponse identifica la regla. El mensaje nunca
        incluye datos personales ni secretos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      description: >
        El recurso no existe para el tenant del solicitante. Un recurso de otro tenant responde igual
        que uno inexistente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: >
        Identificador de correlación de la petición, de 1 a 64 caracteres (letras, dígitos, punto,
        guion y guion bajo). Si falta o es inválido, el servicio genera uno. Siempre se devuelve en
        el header de respuesta del mismo nombre y viaja hasta el despacho al proveedor.
      schema:
        type: string
        maxLength: 64
        pattern: '^[A-Za-z0-9._-]{1,64}$'
    TraceParent:
      name: traceparent
      in: header
      required: false
      description: >
        Cabecera de contexto de traza W3C. Si cumple el formato, el servicio continúa esa traza en
        sus tramos, logs y mensajería; si no cumple se descarta y se inicia una traza nueva. El
        servicio no la devuelve en la respuesta.
      schema:
        type: string
        pattern: '^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
    NotificationId:
      name: notificationId
      in: query
      required: true
      description: Identificador de la notificación.
      schema:
        type: string
        format: uuid
    RecipientId:
      name: recipientId
      in: query
      required: true
      description: Identificador del destinatario, estable entre canales. Se codifica como porcentaje en la query.
      schema:
        type: string
    UploadId:
      name: uploadId
      in: query
      required: true
      description: Identificador de la subida emitida por POST /attachment-uploads.
      schema:
        type: string
    TemplateId:
      name: templateId
      in: query
      required: true
      description: Identificador de la plantilla.
      schema:
        type: string
        format: uuid

  schemas:
    SendNotificationRequest:
      type: object
      required:
        - externalId
        - channelType
        - recipientId
        - recipientAddress
        - priority
      properties:
        externalId:
          type: string
          maxLength: 255
          description: Identificador propio del sistema cliente, usado para idempotencia.
          example: order-42
        channelType:
          type: string
          description: >
            Canal registrado en el catálogo. La configuración por defecto declara EMAIL, SMS, PUSH y
            WHATSAPP.
          example: EMAIL
        recipientId:
          type: string
          description: Identificador del destinatario, estable entre canales.
          example: recipient-1
        recipientAddress:
          type: string
          description: >
            Dirección concreta del canal usado en este envío (email, teléfono, etc.). En SMS es un
            número en formato internacional (signo +, código de país y número, ej. +573001234567); un
            número sin ese formato termina en FAILED sin enviarse. En PUSH es el identificador de
            dispositivo que el proveedor de push emitió a la aplicación cliente (ej. device-token-demo-1234);
            se trata como texto opaco y no se valida su forma: un identificador inválido o caducado termina
            en FAILED sin reintentos. En WHATSAPP es un número en formato internacional (ej.
            +573001234567); un número sin ese formato, o sin cuenta de WhatsApp, termina en FAILED sin
            reintentos.
          example: alice@example.com
        subject:
          type: string
          nullable: true
          description: >
            Opcional -- algunos canales (ej. SMS) no lo usan. En SMS se admite y se ignora: no se
            envía ni se antepone al cuerpo. En PUSH es el título visible, opcional, de hasta 100
            caracteres. En WHATSAPP se admite y se ignora.
          example: Bienvenida
        body:
          type: string
          nullable: true
          description: >
            Cuerpo de la notificación. Obligatorio salvo que se envíe providerTemplate; no puede
            enviarse junto con providerTemplate. La longitud máxima la fija la forma de contenido del
            canal en el catálogo; en SMS son 160 caracteres, en PUSH 900 y en WHATSAPP 1600 por defecto.
            Un contenido más largo se rechaza con 400 y nunca se trunca.
          example: Hola Alice, tu pedido fue confirmado.
        providerTemplate:
          type: object
          nullable: true
          required: [templateId]
          description: >
            Opcional. Envía una plantilla aprobada por el proveedor en lugar de un cuerpo libre;
            excluyente con body. El canal debe declararla en su forma de contenido (GET /channels,
            contentSchema, propiedad providerTemplate); con la configuración por defecto solo WHATSAPP
            lo hace y cualquier otro canal rechaza la notificación con 400. Fuera de la ventana de 24 h
            de WhatsApp solo se admiten plantillas; un texto libre que el proveedor rechaza por estar
            fuera de la ventana termina en FAILED sin reintentos. El servicio valida la forma
            (referencia presente, a lo sumo 20 variables de hasta 1024 caracteres); que la plantilla
            exista y esté aprobada, y que no falte ninguna de sus variables, lo decide el proveedor al
            enviar y un rechazo termina en FAILED.
          properties:
            templateId:
              type: string
              maxLength: 64
              description: Identificador de la plantilla aprobada ante el proveedor.
              example: HXb5b62575e6e4ff6129ad7c8efe1f983e
            variables:
              type: object
              additionalProperties:
                type: string
                maxLength: 1024
              description: Valores de las variables de la plantilla, por nombre.
              example: { "1": "Alice", "2": "42" }
        priority:
          $ref: '#/components/schemas/Priority'
        attachments:
          type: array
          nullable: true
          maxItems: 5
          description: >
            Opcional. Archivos que acompañan la notificación, en el orden en que se entregarán. El canal
            debe declararlos en su forma de contenido (ver GET /channels, campo contentSchema, propiedad
            attachments); un canal que no los declara rechaza toda notificación con adjuntos. Con la
            configuración por defecto ningún canal los declara (tampoco WHATSAPP). Cada adjunto lleva exactamente uno de
            content (archivo de hasta 1 MB codificado en Base64) o url (archivo de más de 1 MB subido antes
            con POST /attachment-uploads y en estado CLEAN). A lo sumo 5 adjuntos y 25 MB (26214400 bytes)
            en total. El servicio verifica el tipo real de cada archivo y lo analiza con un antivirus. Una
            notificación con un adjunto inválido se rechaza completa; nunca se acepta sin el adjunto. Si el
            proveedor que la despacha no sabe enviar adjuntos, termina en FAILED sin enviarse.
          items:
            $ref: '#/components/schemas/Attachment'
        templateId:
          type: [string, 'null']
          format: uuid
          x-status: planned
          description: >
            HU2-127 (planificada). Envío por plantilla guardada. Excluyente con body y providerTemplate; sin él,
            subject, templateValues y event no se admiten.
        templateValues:
          type: [object, 'null']
          x-status: planned
          maxProperties: 50
          additionalProperties:
            type: string
            maxLength: 2000
          description: >
            HU2-127 (planificada). Valor de cada variable de la plantilla. Faltantes obligatorias: 422 con
            missingVariables (NTF-1010).
        event:
          type: [object, 'null']
          x-status: planned
          additionalProperties: true
          description: >
            HU2-128 (planificada). Evento que alimenta el mapeo de la plantilla; solo con templateId. Límites:
            32768 caracteres serializados y profundidad 10 (NTF-1016).

    Attachment:
      type: object
      required: [fileName, contentType, sizeBytes]
      oneOf:
        - required: [content]
          not:
            required: [url]
        - required: [url]
          not:
            required: [content]
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          description: >
            Nombre con el que lo verá el destinatario. Sin separadores de ruta ni caracteres de control;
            distinto de "." y "..". No puede terminar en una extensión prohibida (sin distinguir
            mayúsculas, ignorando puntos y espacios finales): .exe .msi .bat .cmd .com .scr .pif .vbs .vbe
            .js .jse .wsf .wsh .ps1 .hta .cpl .msc .reg .lnk .jar .dll .sh .apk .app .gadget .com.pif .msix
            .war.
          example: factura-0042.pdf
        contentType:
          type: string
          description: >
            Tipo de medio. Se compara en minúsculas y sin parámetros, y debe coincidir con el tipo real
            del contenido. Tipos admitidos por el servicio: application/pdf, image/png, image/jpeg,
            text/plain, text/csv,
            application/vnd.openxmlformats-officedocument.wordprocessingml.document,
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet. Cada canal puede admitir
            menos.
          example: application/pdf
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 10485760
          description: >
            Tamaño real en bytes. Hasta 1048576 va en content; de 1048577 a 10485760, en url. Con content
            debe ser igual al tamaño decodificado; con url, igual al de la subida. Cada canal puede fijar
            menos. Límite inclusivo.
          example: 183422
        content:
          type: string
          format: byte
          description: >
            Archivo de hasta 1 MB codificado en Base64 estándar (RFC 4648, con relleno), sin prefijo
            "data:" ni saltos de línea. Dato sensible: nunca aparece en respuestas, registros ni eventos.
        url:
          type: string
          format: uri
          maxLength: 2048
          description: >
            attachmentUrl devuelta por POST /attachment-uploads para el mismo tenant, cuya subida está en
            estado CLEAN. Cualquier otra dirección se rechaza; el servicio no la descarga. La parte de
            consulta se ignora y la dirección no se guarda.

    IssueAttachmentUploadRequest:
      type: object
      required: [fileName, contentType, sizeBytes]
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          description: Mismas reglas que Attachment.fileName.
          example: contrato-2026.pdf
        contentType:
          type: string
          description: Mismos tipos que Attachment.contentType.
          example: application/pdf
        sizeBytes:
          type: integer
          format: int64
          minimum: 1048577
          maximum: 10485760
          description: Tamaño exacto del archivo que se subirá.
          example: 5242880

    AttachmentUploadState:
      type: string
      enum: [PENDING_SCAN, CLEAN, INFECTED, FAILED]

    AttachmentUploadResponse:
      type: object
      required: [uploadId, state, fileName, contentType, sizeBytes]
      properties:
        uploadId:
          type: string
        state:
          $ref: '#/components/schemas/AttachmentUploadState'
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        sha256:
          type: string
          nullable: true
          description: Huella SHA-256 en hexadecimal, desde que termina el análisis.
        rejectionReason:
          type: string
          nullable: true
          enum: [MALWARE, CONTENT_TYPE_MISMATCH, OBJECT_MISSING, SIZE_MISMATCH, SCAN_EXHAUSTED, EXPIRED]
          description: Solo en INFECTED (MALWARE, CONTENT_TYPE_MISMATCH) y en FAILED (los demás).
        uploadUrl:
          type: string
          format: uri
          nullable: true
          description: Destino del formulario multipart. Solo en la respuesta de POST /attachment-uploads.
        uploadFields:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: >
            Campos firmados del formulario multipart (política con tamaño exacto y tipo declarado). Solo en
            la respuesta de POST /attachment-uploads. Credencial temporal.
        attachmentUrl:
          type: string
          format: uri
          nullable: true
          description: >
            Dirección con la que una notificación referencia este archivo (Attachment.url). Solo en la
            respuesta de POST /attachment-uploads. No contiene firma.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Vencimiento de la política de subida. Solo en la respuesta de POST /attachment-uploads.

    SendNotificationResponse:
      type: object
      required: [notificationId, status, duplicate]
      properties:
        notificationId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/NotificationStatus'
        duplicate:
          type: boolean
          description: true si ya existía una notificación con el mismo (tenantId, externalId).

    SendNotificationBatchRequest:
      type: object
      required:
        - items
      properties:
        batchId:
          type: string
          nullable: true
          description: Opcional -- si no se envía, el componente genera uno.
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/SendNotificationRequest'

    BatchAcceptedResponse:
      type: object
      required:
        - batchId
        - results
        - trackingSaved
      properties:
        batchId:
          type: string
        trackingSaved:
          type: boolean
          description: >
            true si el registro del lote quedó guardado o ya existía; false si el guardado falló y
            el seguimiento del lote no está disponible.
        results:
          type: array
          items:
            $ref: '#/components/schemas/BatchItemResult'

    BatchItemResult:
      type: object
      required: [externalId, outcome, notificationId, rejectionReason]
      properties:
        externalId:
          type: string
        outcome:
          type: string
          enum: [ACCEPTED, DUPLICATE, REJECTED, FAILED]
          description: >
            REJECTED es un rechazo de negocio (canal, contenido o adjunto invalido). FAILED es un
            problema transitorio de infraestructura (por ejemplo el escaner de adjuntos no responde);
            el cliente puede reintentar ese elemento.
        notificationId:
          type: [string, 'null']
          format: uuid
          description: Nulo cuando outcome es REJECTED o FAILED.
        rejectionReason:
          type: [string, 'null']
          description: >
            Solo presente cuando outcome es REJECTED o FAILED. Para FAILED el valor es siempre
            "Internal error"; los rechazos de negocio conservan su texto.

    NotificationStatusResponse:
      type: object
      required: [notificationId, status, channelType, providerId, lastUpdatedAt, correlationId]
      properties:
        notificationId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/NotificationStatus'
        channelType:
          type: string
        providerId:
          type: [string, 'null']
          description: Proveedor del último intento de envío. Nulo si aún no se ha intentado despachar.
        lastUpdatedAt:
          type: string
          format: date-time
        correlationId:
          type: [string, 'null']
          maxLength: 64
          description: >
            Identificador de correlación con el que se aceptó la notificación. Nulo en notificaciones
            anteriores a la introducción del identificador.

    NotificationSearchResponse:
      type: object
      required: [items, limit, offset, hasNext]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationHistoryItem'
        limit:
          type: integer
          description: Tamaño de página efectivamente aplicado.
        offset:
          type: integer
          description: Offset efectivamente aplicado.
        hasNext:
          type: boolean
          description: true si existen más resultados después de esta página.

    NotificationHistoryItem:
      type: object
      required:
        [notificationId, externalId, recipientId, channelType, status, acceptedAt, deliveryAttempts]
      properties:
        notificationId:
          type: string
          format: uuid
        externalId:
          type: string
        recipientId:
          type: string
        channelType:
          type: string
        status:
          $ref: '#/components/schemas/NotificationStatus'
        acceptedAt:
          type: string
          format: date-time
        deliveryAttempts:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryAttempt'

    DeliveryAttempt:
      type: object
      required: [occurredOn, result, origin, providerId]
      properties:
        occurredOn:
          type: string
          format: date-time
        result:
          type: string
          enum: [ACCEPTED, RECOVERABLE_FAILURE, PERMANENT_FAILURE, INVALID_RECIPIENT]
        origin:
          type: string
          enum: [MANUAL, AUTOMATIC]
        providerId:
          type: string
        failedOver:
          type: boolean
          default: false
          description: >
            true si el proveedor falló y el despacho conmutó al siguiente de la ruta; el intento sigue
            en el historial y no cuenta para el tope de reintentos.

    RegisterChannelRequest:
      type: object
      required:
        - channelType
      properties:
        channelType:
          type: string
          example: SMS
        contentSchema:
          type: string
          nullable: true
          description: >
            Esquema JSON Schema (como string) contra el que se valida el contenido enviado por este canal.
            Además del largo de subject y body, puede declarar adjuntos con una propiedad "attachments" de
            tipo arreglo: maxItems (cantidad), items.properties.contentType.enum (tipos, en minúsculas) e
            items.properties.sizeBytes.maximum (bytes). Un canal sin esa propiedad no acepta adjuntos.
        maxRetryAttempts:
          type: integer
          nullable: true
          description: Tope de reintentos automáticos para este canal. Nulo usa el default global.

    RegisterProviderRequest:
      type: object
      required:
        - providerId
        - channels
      properties:
        providerId:
          type: string
          example: brevo
        channels:
          type: array
          minItems: 1
          items:
            type: object
            required: [channelType, preferenceOrder]
            properties:
              channelType:
                type: string
              preferenceOrder:
                type: integer
                description: Orden de preferencia dentro del canal (1 = preferente).

    RegisterProviderResponse:
      type: object
      properties:
        providerId:
          type: string
        enabled:
          type: boolean
          description: false si falta alguna credencial requerida por este proveedor.
        missingCredentials:
          type: array
          items:
            type: string
          description: Vacío cuando enabled es true.

    RecipientPreferencesResponse:
      type: object
      required: [recipientId, optedOutAll, acceptedChannels]
      properties:
        recipientId:
          type: string
        optedOutAll:
          type: boolean
        acceptedChannels:
          type: array
          items:
            type: string
          description: >
            Canales aceptados, en mayúsculas y sin duplicados. Vacía significa sin restricción (todos
            los canales aceptados). Siempre vacía si optedOutAll es true.
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Nulo si el destinatario nunca declaró preferencias en este tenant.

    UpdatePreferencesRequest:
      type: object
      properties:
        optedOutAll:
          type: boolean
          default: false
        acceptedChannels:
          type: array
          items:
            type: string
          description: >
            Vacía o ausente significa que acepta todos los canales. Cada entrada se normaliza (sin
            espacios alrededor, en mayúsculas, sin duplicados); una entrada vacía rechaza la
            actualización con 400. Ignorada si optedOutAll es true.

    ProviderStatus:
      type: string
      enum: [ENABLED, DISABLED, MISSING_ADAPTER]
      description: >
        ENABLED: tiene adaptador y su configuración está completa. DISABLED: tiene adaptador pero le falta
        o tiene mal formada una credencial (ver statusReason). MISSING_ADAPTER: el catálogo lo nombra pero
        el despliegue no tiene adaptador para él.

    ChannelCatalogResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChannelItem'

    ChannelItem:
      type: object
      required: [channelType, contentSchema, providers]
      properties:
        channelType:
          type: string
          example: EMAIL
        contentSchema:
          type: string
          nullable: true
          description: >
            Forma de contenido (JSON Schema como texto) tal como está guardada. Nulo si el canal no declara
            ninguna. Además del largo de subject y body, puede declarar adjuntos con una propiedad
            "attachments" de tipo arreglo: maxItems (cantidad), items.properties.contentType.enum (tipos,
            en minúsculas) e items.properties.sizeBytes.maximum (bytes). Un canal sin esa propiedad no
            acepta adjuntos.
        providers:
          type: array
          minItems: 1
          description: En orden de preferencia.
          items:
            $ref: '#/components/schemas/ChannelProviderItem'

    ChannelProviderItem:
      type: object
      required: [providerId, preferenceOrder, status, statusReason]
      properties:
        providerId:
          type: string
          example: simulated
        preferenceOrder:
          type: integer
          minimum: 1
          description: 1 = preferente, el único que usa hoy el despacho.
        status:
          $ref: '#/components/schemas/ProviderStatus'
        statusReason:
          type: string
          nullable: true
          description: Nulo cuando status es ENABLED. Nombra la configuración ausente o mal formada, nunca su valor.
          example: missing notification.provider.twilio.account-sid (TWILIO_ACCOUNT_SID)

    ConfigurationResponse:
      type: object
      required: [version, source, adoptedAt, pendingRestart, parameters]
      properties:
        version:
          type: integer
          format: int64
          description: Versión asignada por el Componente de Parámetros; 0 para los valores por defecto.
        source:
          type: string
          enum: [PARAMETERS, LAST_KNOWN, DEFAULTS]
        adoptedAt:
          type: string
          format: date-time
        pendingRestart:
          type: array
          items:
            type: string
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/ParameterDescriptorResponse'

    ParameterDescriptorResponse:
      type: object
      required: [key, type, defaultValue, currentValue, min, max, scope, adoption]
      properties:
        key:
          type: string
          example: provider.brevo.timeout-ms
        type:
          type: string
          enum: [INTEGER]
        defaultValue:
          type: integer
          format: int64
        currentValue:
          type: integer
          format: int64
        min:
          type: integer
          format: int64
        max:
          type: integer
          format: int64
        scope:
          type: string
          enum: [GLOBAL, CHANNEL, PROVIDER]
        scopeIds:
          type: array
          items:
            type: string
        adoption:
          type: string
          enum: [HOT, RESTART]
    ProviderCatalogResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProviderItem'

    ProviderItem:
      type: object
      required: [providerId, status, statusReason, channels]
      properties:
        providerId:
          type: string
          example: twilio
        status:
          $ref: '#/components/schemas/ProviderStatus'
        statusReason:
          type: string
          nullable: true
          description: Nulo cuando status es ENABLED. Nombra la configuración ausente o mal formada, nunca su valor.
        channels:
          type: array
          description: Canales que nombran a este proveedor, con su posición en cada uno. Vacío si ninguno.
          items:
            type: object
            required: [channelType, preferenceOrder]
            properties:
              channelType:
                type: string
              preferenceOrder:
                type: integer
                minimum: 1

    ErrorResponse:
      type: object
      required:
        - code
        - correlationId
      properties:
        code:
          type: string
          description: >
            Código estable del error, con formato NTF-<número>; el prefijo del número indica la categoría
            (1 validación, 2 autenticación y autorización, 3 negocio, 4 proveedor, 5 infraestructura).
            Códigos nuevos (nombre en ErrorCode): 1006 INVALID_RECIPIENT, 1007 INVALID_TEMPLATE_SYNTAX,
            1008 UNDECLARED_TEMPLATE_VARIABLE, 1009 TEMPLATE_LIMIT_EXCEEDED, 1010 MISSING_VARIABLES,
            2004 AUTHENTICATION_CLAIMS_MISSING, 2005 WEBHOOK_SECRET_INVALID, 3040 RECIPIENT_UNDELIVERABLE,
            3041 DEVICE_NOT_FOUND, 3050 TEMPLATE_NOT_FOUND,
            3051 TEMPLATE_ALREADY_EXISTS, 3052 TEMPLATE_VERSION_CONFLICT, 3053 TEMPLATE_ARCHIVED,
            3060 PROVIDER_TEST_IN_PROGRESS, 3022 NOTIFICATION_STATE_NOT_ALLOWED (estado que no admite
            reintento ni reenvío) y 3070 RESEND_CHANNEL_INVALID (reenvío por el mismo canal, con
            adjuntos o con externalId derivado demasiado largo).
            CHANNEL_NOT_AVAILABLE de plantillas reutiliza NTF-1003.
          enum:
            - NTF-1001
            - NTF-1002
            - NTF-1003
            - NTF-1004
            - NTF-1005
            - NTF-1006
            - NTF-1007
            - NTF-1008
            - NTF-1009
            - NTF-1010
            - NTF-2001
            - NTF-2002
            - NTF-2003
            - NTF-2004
            - NTF-2005
            - NTF-3000
            - NTF-3001
            - NTF-3002
            - NTF-3003
            - NTF-3004
            - NTF-3005
            - NTF-3006
            - NTF-3007
            - NTF-3008
            - NTF-3010
            - NTF-3011
            - NTF-3012
            - NTF-3020
            - NTF-3021
            - NTF-3022
            - NTF-3030
            - NTF-3040
            - NTF-3041
            - NTF-3050
            - NTF-3051
            - NTF-3052
            - NTF-3053
            - NTF-3060
            - NTF-3070
            - NTF-4000
            - NTF-4002
            - NTF-4010
            - NTF-4011
            - NTF-4012
            - NTF-4020
            - NTF-4021
            - NTF-5000
            - NTF-5001
            - NTF-5002
            - NTF-5003
            - NTF-5004
            - NTF-5005
            - NTF-5006
            - NTF-5007
            - NTF-5010
            - NTF-5020
            - NTF-5021
            - NTF-5022
            - NTF-5030
            - NTF-5040
            - NTF-5050
            - NTF-5060
        message:
          type: string
        correlationId:
          type: string
          maxLength: 64
          description: Identificador de correlación de la petición que produjo el error.
        missingVariables:
          type: array
          description: Solo en NTF-1010. Todas las variables obligatorias ausentes del render.
          items:
            type: string

    PepErrorResponse:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          format: uri
          description: Siempre urn:security-pep:error:<code en minúsculas>.
          example: urn:security-pep:error:access_denied
        title:
          type: string
          description: Igual a code.
        status:
          type: integer
          enum: [401, 403, 503]
        detail:
          type: string
          description: Texto estándar del estado HTTP.
          example: Forbidden
        code:
          type: string
          enum: [TOKEN_INVALID, ACCESS_DENIED, PEP_UNAVAILABLE]
          description: TOKEN_INVALID acompaña al 401, ACCESS_DENIED al 403 y PEP_UNAVAILABLE al 503.

    Priority:
      type: string
      enum: [LOW, NORMAL, HIGH]

    NotificationStatus:
      type: string
      enum: [PENDING, IN_PROCESS, DELIVERED, RECOVERABLE, FAILED, DISCARDED]

    NotificationLiveUpdate:
      type: object
      properties:
        action:
          type: string
          enum: [UPSERT, REMOVE]
          description: >
            UPSERT: la notificación cumple los filtros activos, el dashboard debe mostrarla/actualizarla.
            REMOVE: dejó de cumplirlos, el dashboard debe quitarla de la vista visible.
        notification:
          $ref: '#/components/schemas/NotificationHistoryItem'
      required:
        - action
        - notification

    FailureCause:
      type: string
      enum:
        - TRANSPORT_ERROR
        - PROVIDER_ERROR
        - PROVIDER_REJECTED
        - PROVIDER_TEMPORARY
        - ATTACHMENTS_UNSUPPORTED
        - RETRIES_EXHAUSTED
        - INVALID_RECIPIENT
        - UNKNOWN
      description: >
        Causa del fallo de un intento, de un conjunto cerrado; nunca texto del proveedor ni mensajes
        de excepción.

    NotificationTimelineResponse:
      type: object
      required: [notificationId, status, channelType, recipient, correlationId, attempts]
      properties:
        notificationId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/NotificationStatus'
        channelType:
          type: string
        recipient:
          type: string
          description: Destinatario enmascarado, salvo para ADMINISTRADOR_PLATAFORMA o ADMINISTRADOR_APLICACION.
        correlationId:
          type: [string, 'null']
          maxLength: 64
        attempts:
          type: array
          description: Ordenados por occurredOn ascendente.
          items:
            $ref: '#/components/schemas/TimelineAttempt'

    TimelineAttempt:
      type: object
      required: [occurredOn, providerId, result, origin, cycle, latencyMillis, failureCause, correlationId]
      properties:
        occurredOn:
          type: string
          format: date-time
        providerId:
          type: string
        result:
          type: string
          enum: [ACCEPTED, RECOVERABLE_FAILURE, PERMANENT_FAILURE, INVALID_RECIPIENT]
        origin:
          type: string
          enum: [MANUAL, AUTOMATIC]
        cycle:
          type: integer
          minimum: 1
        failedOver:
          type: boolean
          default: false
          description: true si el proveedor falló y el despacho conmutó al siguiente de la ruta.
        latencyMillis:
          type: [integer, 'null']
          format: int64
          description: Duración de la llamada al proveedor. Nulo en intentos anteriores a la introducción del campo.
        failureCause:
          oneOf:
            - $ref: '#/components/schemas/FailureCause'
            - type: 'null'
          description: Nulo si el intento fue aceptado o es anterior a la introducción del campo.
        correlationId:
          type: [string, 'null']
          maxLength: 64

    ResendNotificationRequest:
      type: object
      required: [notificationId, channelType, recipient]
      properties:
        notificationId:
          type: string
          format: uuid
          description: Notificación original, en estado FAILED.
        channelType:
          type: string
          description: Canal nuevo; debe diferir del original y estar disponible en el catálogo.
        recipient:
          type: string
          description: Dirección en el canal nuevo. Es dato personal y no se devuelve ni se registra.

    ProviderConnectionTestRequest:
      type: object
      required: [channel, providerId]
      properties:
        channel:
          type: string
          example: EMAIL
          description: Canal del catálogo (GET /channels).
        providerId:
          type: string
          example: brevo
          description: Proveedor del catálogo para ese canal (GET /providers).

    ProviderConnectionTestResponse:
      type: object
      required: [providerId, channel, status, latencyMs, errorCode]
      properties:
        providerId:
          type: string
        channel:
          type: string
        status:
          type: string
          enum: [OK, FAILED]
        latencyMs:
          type: integer
          format: int64
        errorCode:
          type: [string, 'null']
          enum:
            - CREDENTIALS_MISSING
            - AUTH_REJECTED
            - UNREACHABLE
            - TIMEOUT
            - PROVIDER_ERROR
            - ADAPTER_MISSING
            - SIMULATED_FAILURE
            - null
          description: Nulo cuando status es OK.

    ProviderHealthResponse:
      type: object
      required: [generatedAt, windowSeconds, grafanaUrl, providers]
      properties:
        generatedAt:
          type: string
          format: date-time
        windowSeconds:
          type: integer
        grafanaUrl:
          type: [string, 'null']
          format: uri
          description: Dirección única del dashboard de Grafana del servicio. Nulo si no está configurada.
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ProviderHealth'

    ProviderHealth:
      type: object
      required: [provider, channel, status, successRate, sampleCount, latencyP95Millis, lastError]
      properties:
        provider:
          type: string
        channel:
          type: string
        status:
          type: string
          enum: [HEALTHY, DEGRADED, DOWN, UNKNOWN, CIRCUIT_OPEN]
          description: CIRCUIT_OPEN está reservado y no lo produce el servicio todavía.
        successRate:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: Nulo sin muestras suficientes.
        sampleCount:
          type: integer
          minimum: 0
        latencyP95Millis:
          type: [integer, 'null']
          format: int64
          description: Calculada por proveedor y repetida en cada uno de sus canales.
        lastError:
          oneOf:
            - $ref: '#/components/schemas/ProviderLastError'
            - type: 'null'
        failedOver:
          type: boolean
          description: Reservado para una extensión futura.

    ProviderLastError:
      type: object
      required: [result, at]
      properties:
        result:
          type: string
          enum: [recoverable, failed]
        at:
          type: string
          format: date-time
          description: Resolución de 60 segundos.
        code:
          type: string
          description: Reservado; hoy ausente.
        category:
          type: string
          description: Reservado; hoy ausente.

    UndeliverableRecipientRequest:
      type: object
      required: [channel, address]
      properties:
        channel:
          type: string
          example: EMAIL
        address:
          type: string
          description: Dirección del canal. Dato personal; viaja en el cuerpo y nunca en la URL.

    UndeliverableRecipientResponse:
      type: object
      required: [marked, channel, address, reason, markedAt]
      properties:
        marked:
          type: boolean
        channel:
          type: string
        address:
          type: string
          description: Dirección enmascarada.
        reason:
          type: [string, 'null']
          description: Motivo del rebote duro. Nulo si no está marcada.
        markedAt:
          type: [string, 'null']
          format: date-time

    RegisterDeviceRequest:
      type: object
      required: [platform, token]
      properties:
        platform:
          $ref: '#/components/schemas/DevicePlatform'
        token:
          type: string
          minLength: 1
          description: Token del dispositivo emitido por el proveedor de push. Se almacena cifrado.
        subject:
          type: string
          description: Hoy solo el sujeto de la sesión; un valor distinto responde 403.

    DevicePlatform:
      type: string
      enum: [ANDROID, IOS, WEB]

    DeviceResponse:
      type: object
      required: [deviceId, recipientId, platform, token, originComponent, createdAt, lastSeenAt]
      properties:
        deviceId:
          type: string
          format: uuid
        recipientId:
          type: string
          description: Identificador de destinatario generado por el servicio y asociado al sujeto.
        platform:
          $ref: '#/components/schemas/DevicePlatform'
        token:
          type: string
          description: Enmascarado (**** y los últimos 4 caracteres), salvo para ADMINISTRADOR_PLATAFORMA o ADMINISTRADOR_APLICACION.
        originComponent:
          type: string
          description: Sujeto de la sesión que registró el dispositivo.
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time

    DeviceListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeviceResponse'

    RemoveDeviceRequest:
      type: object
      required: [deviceId]
      properties:
        deviceId:
          type: string
          format: uuid

    EraseDevicesRequest:
      type: object
      required: [subject]
      properties:
        subject:
          type: string
          minLength: 1

    TemplateCategory:
      type: string
      enum: [ACADEMICO, ADMINISTRATIVO, MARKETING, SEGURIDAD]
      description: SEGURIDAD se marca como crítica (critical=true en la lectura).

    TemplateStatus:
      type: string
      enum: [ACTIVA, ARCHIVADA]

    TemplateVariable:
      type: object
      required: [name, required]
      properties:
        name:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_]{0,39}$'
        required:
          type: boolean
          description: Lo no declarado es obligatorio.

    CreateTemplateRequest:
      type: object
      required: [key, category, channel, language, body]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 60
          pattern: '^[A-Za-z0-9._-]+$'
        category:
          $ref: '#/components/schemas/TemplateCategory'
        channel:
          type: string
        language:
          type: string
          minLength: 2
          maxLength: 10
          description: Etiqueta BCP 47 corta (es, en, es-CO).
        subject:
          type: [string, 'null']
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 20000
        variables:
          type: array
          maxItems: 50
          description: Declaración de obligatoriedad. Cada nombre debe aparecer en el texto.
          items:
            $ref: '#/components/schemas/TemplateVariable'
        sampleValues:
          type: object
          x-status: available
          maxProperties: 50
          additionalProperties:
            type: string
            maxLength: 2000
          description: >
            HU2-126. Datos ficticios para la vista previa; es lo único que la plantilla guarda de valores.

    UpdateTemplateRequest:
      type: object
      required: [templateId, version, category, body]
      properties:
        templateId:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          description: Versión vigente conocida por el cliente; si no coincide, 409.
        category:
          $ref: '#/components/schemas/TemplateCategory'
        subject:
          type: [string, 'null']
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 20000
        variables:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/TemplateVariable'
        sampleValues:
          type: object
          x-status: available
          maxProperties: 50
          additionalProperties:
            type: string
            maxLength: 2000
          description: >
            HU2-126. Datos ficticios para la vista previa; es lo único que la plantilla guarda de valores.

    ArchiveTemplateRequest:
      type: object
      required: [templateId]
      properties:
        templateId:
          type: string
          format: uuid

    TemplateResponse:
      type: object
      required:
        [templateId, key, category, critical, channel, language, subject, body, variables, status, version, createdAt, updatedAt]
      properties:
        templateId:
          type: string
          format: uuid
        key:
          type: string
        category:
          $ref: '#/components/schemas/TemplateCategory'
        critical:
          type: boolean
        channel:
          type: string
        language:
          type: string
        subject:
          type: [string, 'null']
