    put:
      tags: [Plantillas]
      summary: Actualizar una plantilla
      description: >
        HU2-119. Control optimista: version debe coincidir con la vigente; si no, 409 con
        NTF-3052. Una plantilla archivada no se actualiza (NTF-3053). Requiere rol EDITOR_PLANTILLAS o
        ADMINISTRADOR_PLATAFORMA.
      operationId: updateTemplate
      x-status: available
      x-allowed-roles: [EDITOR_PLANTILLAS, ADMINISTRADOR_PLATAFORMA]
      requestBody:
        required: true
        content:
