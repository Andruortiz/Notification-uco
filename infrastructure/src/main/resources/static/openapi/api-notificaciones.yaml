          in: query
          schema:
            $ref: '#/components/schemas/TemplateCategory'
        - name: channel
          in: query
          schema:
            type: string
        - name: language
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 10
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TemplateStatus'
        - name: page
          in: query
          description: Número de página desde 0. Default 0.
          schema:
