openapi: 3.1.0
info:
  title: API de Notificaciones
  description: >
    API de Notification-uco. Cada endpoint corresponde a un caso de uso documentado.  Convención de nombramiento (versión 2):
    toda ruta es literal, sin `:` ni `{}`, para que el PDP la registre como recurso protegido por
    igualdad exacta de método y ruta. Los identificadores de recurso viajan en la query string
    (consultas) o en el cuerpo (comandos). Cada operación declara `x-status` (`available` si el
    servicio la sirve, `planned` si solo está documentada) y `x-allowed-roles` (lista de roles permitidos por operación;
    sin orden entre ellos; el permiso efectivo es la unión de los roles del solicitante). CU-03 (despachar) no
    tiene endpoint propio -- es un proceso interno disparado por el consumidor de RabbitMQ, nunca
    invocado directamente por un cliente. Autenticación (HU2-096): toda operación exige
    `Authorization: Bearer <JWT>` -- un token firmado por la plataforma de Seguridad y validado con su
    clave pública, con las claims `sub`, `tenantId`, `role` (texto o lista de los roles `ADMINISTRADOR_PLATAFORMA`, `ADMINISTRADOR_APLICACION`,
    `EDITOR_PLANTILLAS`, `OPERADOR`, `AUDITOR` y `CLIENTE`; los desconocidos se ignoran) y `exp`, y una claim de cliente opcional. El tenant y el rol del solicitante salen
    siempre del token, nunca de un encabezado (`X-Tenant-Id` no se acepta). Una claim obligatoria
    ausente responde 401 con NTF-2004; el resto de rechazos, 401 con NTF-2001. Con el PEP activo, la credencial puede ser también la
    cookie de sesión `SECURITY_BASELINE_SESSION` (HU2-101): el servicio resuelve tenant y usuario
    consultando la sesión a la plataforma de Seguridad, el rol efectivo es CLIENTE y el Bearer tiene
    precedencia sobre la cookie. El PEP puede responder 401, 403 o 503 con `PepErrorResponse` y la
    cabecera `X-Decision-Id`; si la plataforma de sesiones no responde, el servicio responde 503 con
    `ErrorResponse` (NTF-2003). GET /configuration (HU2-073) exige
    el rol ADMINISTRADOR_APLICACION o ADMINISTRADOR_PLATAFORMA.

    Registro de cambios 2.0.0 (incompatible con 1.0.0, corte directo sin alias ni prefijo /v2):

    1. Ninguna ruta contiene `:` ni `{}`. Los identificadores van en la query string o en el cuerpo.
    2. Se retiran sin alias: `GET /notifications/{id}`, `GET /attachment-uploads/{uploadId}`,
    `POST /attachment-uploads/{uploadId}:complete`, `POST /notifications:sendBatch`,
    `GET /notifications:subscribe`, `POST /notifications:subscribeTicket`,
    `POST /notifications/{id}:retry`, `POST /channels:register`, `POST /providers:register`,
    `GET /recipients/{recipientId}/preferences`, `POST /recipients/{recipientId}:updatePreferences`.
    3. `POST /attachment-uploads` devuelve `Location: /attachment-uploads/status?uploadId=<id>`.
    4. La finalización de una subida y el reintento reciben el identificador en el cuerpo JSON.
    5. Las preferencias se actualizan con `PUT /recipients/preferences?recipientId=`.
    6. `SendNotificationResponse`, `NotificationStatusResponse`, `BatchItemResult`,
    `NotificationHistoryItem` y `DeliveryAttempt` declaran `required`.
    7. Se añade el esquema de seguridad `SessionCookie` y las respuestas 401, 403 y 503 del PEP con
    `X-Decision-Id`.
    8. Cada operación declara `x-status` y `x-allowed-roles`.
    9. HU2-111, incompatible: se retira `POST /notifications/stream/tickets` y el parámetro `ticket`
    de `GET /notifications/stream`. El stream se autentica con Bearer o con la cookie de sesión.
    10. HU2-103: se declaran en `x-public-routes` las rutas de documentación que no exigen credencial
    (`security: []` para el PEP): `GET /openapi/api-notificaciones.yaml` y `GET /v3/api-docs` en todo
    entorno; `GET /v3/api-docs/swagger-config`, `GET /swagger-ui.html` y `GET /swagger-ui/**` solo
    fuera de producción. No son operaciones de `paths` ni recursos que haya que registrar en el PDP.
    11. Lote del nivel 1 (adiciones compatibles, sin cambio de versión mayor; todas las operaciones
    nuevas nacieron `planned`; el 2.1.0 las pasa a `available`):
    HU2-113 añade el código NTF-2004 y documenta las claims del Bearer; HU2-114 añade
    `POST /provider-connection-tests`; HU2-115 añade `failedOver` a `DeliveryAttempt`; HU2-116 añade
    `POST /recipients/undeliverable-lookups`, `POST /recipients/undeliverable-releases` y la ruta
    pública `POST /providers/brevo/bounce-events` (solo en `x-public-routes`); HU2-117 añade
    `POST /notification-resends`, aclara `POST /notification-retries` y fija `maxLength: 255` en
    `externalId`; HU2-118 añade `GET /notifications/timeline`; HU2-119 añade las siete rutas de
    plantillas; HU2-120 añade las cuatro de dispositivos y `INVALID_RECIPIENT` al resultado de un
    intento; HU2-121 añade `GET /provider-health`.

    Registro de cambios 2.1.0 (integración del nivel 1, adiciones compatibles sobre 2.0.0):

    1. Las 17 operaciones nuevas del nivel 1 y `POST /notification-retries` pasan a `available`.
    2. Nuevos códigos de error: NTF-3022 NOTIFICATION_STATE_NOT_ALLOWED (reintento o reenvío sobre un
    estado que no lo admite) y NTF-3070 RESEND_CHANNEL_INVALID (reenvío por el mismo canal, con
    adjuntos o con externalId derivado demasiado largo); `POST /notification-retries` y
    `POST /notification-resends` los usan en lugar de NTF-3008 y NTF-1003 para esos casos.
    3. El webhook `POST /providers/brevo/bounce-events` se autentica con la cabecera
    `X-Brevo-Webhook-Secret`, declarada en `x-public-routes`.
    4. `POST /template-renders` limita `values` a 50 variables de hasta 2000 caracteres.
    5. Límites conocidos documentados: un reenvío con adjuntos responde 400; `GET /provider-health`
    puede mostrar UNKNOWN o no listar un proveedor cuyo breaker de conmutación está abierto.

    Registro de cambios 2.2.0 (autorización no lineal por roles, HU2-123; rutas sin cambios):

    1. `x-minimum-role` (rol mínimo jerárquico) se sustituye por `x-allowed-roles` (lista de roles permitidos) en las 33
    operaciones. El permiso efectivo de un solicitante es la unión de sus roles.
    2. `role` (`ADMINISTRADOR`, `OPERADOR`, `CLIENTE`) se sustituye por seis roles sin orden: `ADMINISTRADOR_PLATAFORMA`,
    `ADMINISTRADOR_APLICACION`, `EDITOR_PLANTILLAS`, `OPERADOR`, `AUDITOR` y `CLIENTE`. Un token cuyo `role` solo trae
    valores desconocidos, como `ADMINISTRADOR`, responde 401 con NTF-2004.
    3. El claim `role` acepta un texto o una lista; los valores desconocidos se ignoran.
    4. Una operación que no admite ninguno de los roles del solicitante responde 403 con NTF-2002 (sin PEP) o con el
    rechazo del PEP.

    Tabla de migración (método y ruta v1 a método y ruta v2):

    | v1 | v2 |
    |---|---|
    | POST /notifications | POST /notifications |
    | GET /notifications | GET /notifications |
    | POST /notifications:sendBatch | POST /notifications/batches |
    | GET /notifications/{id} | GET /notifications/detail?notificationId={id} |
    | POST /notifications/{id}:retry | POST /notification-retries (cuerpo notificationId; available) |
    | GET /notifications:subscribe | GET /notifications/stream |
    | POST /notifications:subscribeTicket | retirado sin reemplazo (HU2-111); el stream usa Bearer o cookie |
    | POST /attachment-uploads | POST /attachment-uploads |
    | POST /attachment-uploads/{uploadId}:complete | POST /attachment-upload-completions (cuerpo uploadId) |
    | GET /attachment-uploads/{uploadId} | GET /attachment-uploads/status?uploadId={uploadId} |
    | GET /channels | GET /channels |
    | GET /providers | GET /providers |
    | GET /configuration | GET /configuration |
    | POST /channels:register | POST /channels (planned) |
    | POST /providers:register | POST /providers (planned) |
    | GET /recipients/{recipientId}/preferences | GET /recipients/preferences?recipientId={recipientId} (planned) |
    | POST /recipients/{recipientId}:updatePreferences | PUT /recipients/preferences?recipientId={recipientId} (planned) |
    | (nuevo, HU2-114) | POST /provider-connection-tests (available) |
    | (nuevo, HU2-116) | POST /recipients/undeliverable-lookups (available) |
    | (nuevo, HU2-116) | POST /recipients/undeliverable-releases (available) |
    | (nuevo, HU2-117) | POST /notification-resends (available) |
    | (nuevo, HU2-118) | GET /notifications/timeline?notificationId={id} (available) |
    | (nuevo, HU2-119) | POST /templates, PUT /templates, GET /templates (available) |
    | (nuevo, HU2-119) | GET /templates/detail?templateId={id} (available) |
    | (nuevo, HU2-119) | POST /template-archivals, POST /template-variable-detections, POST /template-renders (available) |
    | (nuevo, HU2-120) | POST /devices, GET /devices, POST /device-removals, POST /device-erasures (available) |
    | (nuevo, HU2-121) | GET /provider-health (available) |

    Registro de cambios 2.3.1 (HU2-126 implementada, adiciones compatibles sobre 2.3.0):
    1. `POST /template-previews` (`previewTemplate`) pasa de planned a available; sin rutas nuevas ni cambios en rutas existentes.
    2. `sampleValues` pasa de planned a available en `CreateTemplateRequest`, `UpdateTemplateRequest` y `TemplateResponse`.
    3. Esquemas nuevos `PreviewTemplateRequest`, `TemplatePreviewResponse`, `SmsSegmentation` y `SmsEncoding`. Sin códigos NTF nuevos: la vista previa reutiliza NTF-1007, NTF-1008 y NTF-1009.

    Registro de cambios 2.3.0 (contrato del nivel 2, adiciones compatibles sobre 2.2.0; ninguna ruta existente cambia):

    1. Las 19 operaciones nuevas nacen `planned` y no se sirven hasta que su historia las implemente: HU2-125
    `GET /audit-entries` y `GET /audit-entries/detail`; HU2-126 `POST /template-previews`; HU2-127 no añade rutas;
    HU2-128 `PUT /template-mappings`, `GET /template-mappings` y `POST /template-mapping-resolutions`; HU2-129
    `POST /template-provider-links`, `GET /template-provider-links`, `POST /template-approval-syncs`,
    `POST /template-publications`, `POST /template-unpublications`, `POST /provider-template-allowlist-entries`,
    `GET /provider-template-allowlist-entries` y `POST /provider-template-allowlist-removals`; HU2-130
    `POST /template-blocks`, `PUT /template-blocks`, `GET /template-blocks`, `GET /template-blocks/detail` y
    `POST /template-block-archivals`.
    2. Propiedades planned en esquemas de operaciones ya servidas (`x-status: planned` en la propiedad): HU2-127
    `templateId`, `templateValues` y `event` en `SendNotificationRequest`; HU2-126 `sampleValues` en
    `CreateTemplateRequest`, `UpdateTemplateRequest` y `TemplateResponse`; HU2-130 `blockRefs` en `TemplateResponse`.
    3. Códigos NTF planificados, sin entrada en `ErrorCode` ni en el enum de `ErrorResponse.code` hasta que tengan
    emisor en el código: HU2-127 NTF-1011 TEMPLATE_CONTENT_CONFLICT y NTF-1012 TEMPLATE_CHANNEL_MISMATCH; HU2-128
    NTF-1013 INVALID_MAPPING_PATH, NTF-1014 UNKNOWN_MAPPING_VARIABLE, NTF-1015 MAPPING_LIMIT_EXCEEDED, NTF-1016
    EVENT_LIMIT_EXCEEDED y NTF-3054 TEMPLATE_MAPPING_VERSION_CONFLICT; HU2-129 NTF-3071 PROVIDER_TEMPLATE_NOT_FOUND,
    NTF-3072 PROVIDER_TEMPLATE_NOT_APPROVED, NTF-3073 TEMPLATE_PUBLISHED, NTF-3074 TEMPLATE_NOT_WHATSAPP y NTF-4070
    PROVIDER_TEMPLATE_UNAVAILABLE; HU2-130 NTF-3080 BLOCK_NOT_FOUND a NTF-3088 BLOCK_ARCHIVED; HU2-125 NTF-3090
    AUDIT_ENTRY_NOT_FOUND y NTF-5070 AUDIT_APPEND_FAILED.
    4. Fuera de este contrato: B5, E6, F1, F6, D8, E4 y H6.

  version: 2.3.1
servers:
  - url: /
    description: >
      Relativo al host donde se sirve este contrato -- funciona igual en local, dev y prod sin
      editar este archivo cuando cambie el puerto o el dominio.

security:
  - BearerAuth: []
  - SessionCookie: []

x-public-routes:
  - method: GET
    path: /openapi/api-notificaciones.yaml
    exposure: always
    security: []
  - method: GET
    path: /v3/api-docs
    exposure: always
    security: []
  - method: GET
    path: /v3/api-docs/swagger-config
    exposure: non-production
    security: []
  - method: GET
    path: /swagger-ui.html
    exposure: non-production
    security: []
  - method: GET
    path: /swagger-ui/**
    exposure: non-production
    security: []
  - method: POST
    path: /providers/brevo/bounce-events
    exposure: always
    security: []
    headers:
      - name: X-Brevo-Webhook-Secret
        required: true
        description: Secreto compartido; debe coincidir con la variable BREVO_WEBHOOK_SECRET.
    description: >
      HU2-116. Webhook de rebotes de Brevo. No exige credencial del PEP; se autentica con el secreto
      compartido de la variable BREVO_WEBHOOK_SECRET enviado en la cabecera X-Brevo-Webhook-Secret. Sin secreto configurado,
      o con uno que no coincide, responde 401 con NTF-2005 y no procesa el evento. Solo los rebotes
      duros (hard_bounce, invalid_email, blocked) marcan la dirección; soft_bounce y deferred se
      descartan. Responde 2xx únicamente tras persistir y 5xx si falla.

tags:
  - name: Notificaciones
    description: CU-01, CU-02, CU-04, CU-05, CU-06
  - name: Catálogo
    description: >
      CU-07, CU-08. La consulta (GET /channels, GET /providers) está disponible; el registro
      (POST /channels, POST /providers) sigue bloqueado.
  - name: Preferencias
    description: CU-09
  - name: Adjuntos
    description: >
      Subida de archivos de más de 1 MB al almacén del servicio para adjuntarlos a notificaciones.
      Los archivos de hasta 1 MB viajan embebidos en la propia notificación.
  - name: Configuración
    description: >
      CU-11 (lectura). GET /configuration expone los parámetros gestionables y la configuración en uso;
      exige el rol ADMINISTRADOR_APLICACION o ADMINISTRADOR_PLATAFORMA.
  - name: Dispositivos
    description: >
      HU2-120. Registro de dispositivos push por identidad de destinatario. Los tokens se almacenan
      cifrados y se devuelven enmascarados salvo para ADMINISTRADOR_PLATAFORMA o ADMINISTRADOR_APLICACION.
  - name: Plantillas
    description: >
      HU2-119. Plantillas con variables {{nombre}} por canal e idioma, propias de cada tenant.
  - name: Auditoría
    description: >
      HU2-125. Consulta de solo lectura del registro de actividad de configuración. Nunca contiene contenido de mensajes.

paths:
  /notifications:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/TraceParent'
    post:
      tags: [Notificaciones]
      summary: Enviar una notificación
      description: >
        CU-01. Acepta la notificación, la registra en estado PENDING y la encola para su despacho
        asíncrono. Si ya existe una notificación con el mismo (tenantId, externalId), devuelve esa
        misma notificación en vez de crear una segunda (idempotencia).
      operationId: sendNotification
      x-status: available
      x-allowed-roles: [CLIENTE, ADMINISTRADOR_APLICACION, ADMINISTRADOR_PLATAFORMA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendNotificationRequest'
      responses:
        '202':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Notificación aceptada (nueva o duplicada -- ver el campo "duplicate").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendNotificationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: >
            El canal no existe/está deshabilitado, el contenido no cumple el esquema del canal, o un adjunto
            es inválido: el canal no acepta adjuntos; el adjunto incumple un tope del servicio (cantidad,
            tamaño, tamaño total, tipo, extensión) o una regla del canal; lleva content y url a la vez o
            ninguno; content no es Base64 válido o no coincide con sizeBytes; url no es una subida de este
            tenant o sus datos no coinciden; la subida está INFECTED; el tipo real no coincide con el
            declarado; o el archivo contiene software malicioso. El mensaje identifica el adjunto por su
            posición (attachments[i]) y la regla incumplida; nunca incluye el contenido ni la dirección.
            También INVALID_RECIPIENT (NTF-1006) cuando la dirección no tiene el formato del canal
            (SMS en E.164, correo válido); se rechaza antes de persistir.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: >
            Un adjunto referencia una subida todavía en PENDING_SCAN. Reintentar cuando
            GET /attachment-uploads/status?uploadId=... devuelva CLEAN. Una subida en FAILED se rechaza con 400.
            También responde 409 ante una modificación concurrente, una clave externalId ya aceptada o una
            transición de estado no permitida, con mensaje fijo. También RECIPIENT_UNDELIVERABLE
            (NTF-3040) si la dirección está marcada como no entregable por un rebote duro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: El cuerpo de la solicitud supera 8 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            X-Decision-Id:
              $ref: '#/components/headers/DecisionId'
          description: >
            El antivirus o el almacén de archivos no están disponibles o no respondieron a tiempo. La
            notificación no se aceptó; puede reintentarse. Las notificaciones sin adjuntos no se ven
            afectadas. También lo devuelve el PEP (PEP_UNAVAILABLE) cuando no puede decidir el acceso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PepErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Notificaciones]
      summary: Consultar histórico y trazabilidad
      description: >
        CU-05. Busca notificaciones por filtros combinables. Cada resultado incluye su recorrido
        completo de intentos, no solo el estado actual (a diferencia de GET /notifications/detail, que
        solo exige rol CLIENTE). Requiere rol OPERADOR, ADMINISTRADOR_APLICACION o ADMINISTRADOR_PLATAFORMA.
      operationId: searchNotifications
      x-status: available
      x-allowed-roles: [OPERADOR, ADMINISTRADOR_APLICACION, ADMINISTRADOR_PLATAFORMA]
      parameters:
        - name: recipientId
          in: query
          schema:
            type: string
        - name: channelType
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/NotificationStatus'
        - name: from
          in: query
          description: Fecha/hora mínima de aceptación (inclusive).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Fecha/hora máxima de aceptación (inclusive).
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: Tamaño de página. Default 50, máximo 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          description: Posición inicial dentro del conjunto de resultados. Default 0.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Página de notificaciones que cumplen el criterio (items vacío si no hay resultados).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSearchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: >
            Parámetros inválidos -- from posterior a to, o limit/offset fuera de su rango válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/PepUnavailable'
  /notifications/stream:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/TraceParent'
    get:
      tags: [Notificaciones]
      summary: Suscribirse a actualizaciones en tiempo real
      description: >
        Historia "dashboard en tiempo real". Abre un stream Server-Sent Events: primero reproduce la
        foto vigente de las notificaciones del tenant que cumplen los filtros (equivalente a repetir
        GET /notifications sin paginar, acotado a 200 resultados), y luego continúa entregando cada
        cambio relevante mientras la conexión permanezca abierta. Una reconexión (ej. tras una caída
        de red) es, para el servidor, una solicitud nueva -- siempre reproduce la foto vigente antes
        de retomar el flujo en vivo, sin necesitar ningún encabezado ni parámetro de reanudación.
        Autenticación: con cabecera `Authorization: Bearer` o con la cookie de sesión
        `SECURITY_BASELINE_SESSION` (HU2-111), que un `EventSource` nativo envía con
        `withCredentials`. La credencial nunca viaja en la dirección de la conexión. Si llega la
        cabecera `Authorization`, tiene prioridad sobre la cookie. Sin credenciales, o con una
        sesión inválida, responde 401; si la plataforma de sesiones no responde, 503.
      operationId: subscribeToNotificationUpdates
      x-status: available
      x-allowed-roles: [CLIENTE, OPERADOR, ADMINISTRADOR_APLICACION, ADMINISTRADOR_PLATAFORMA]
      parameters:
        - name: recipientId
          in: query
          schema:
            type: string
        - name: channelType
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/NotificationStatus'
        - name: from
          in: query
          description: Fecha/hora mínima de aceptación (inclusive). Mismo campo que en la búsqueda.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Fecha/hora máxima de aceptación (inclusive). Mismo campo que en la búsqueda.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: >
            Stream Server-Sent Events. Cada evento `data` es un `NotificationLiveUpdate`. La conexión
            permanece abierta hasta que el cliente la cierra; el servidor intercala comentarios de
            keep-alive periódicos.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/NotificationLiveUpdate'
        '401':
          description: >
            Sin credenciales, cabecera `Authorization` inválida o cookie de sesión inválida.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            X-Decision-Id:
              $ref: '#/components/headers/DecisionId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PepErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/PepUnavailable'

  /notifications/batches:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/TraceParent'
    post:
      tags: [Notificaciones]
      summary: Enviar un lote de notificaciones
      description: >
        Implementado. El lote es su propia unidad de seguimiento, no un bucle sobre POST
        /notifications -- cada elemento se valida e idempotiza por separado, y un elemento
        inválido no bloquea a los demás. Un elemento con un adjunto inválido, o que referencia una
        subida todavía en PENDING_SCAN, o rechazado por el catálogo (canal inexistente o
        deshabilitado, contenido que no cumple la forma del canal), se rechaza solo, con su motivo;
        los demás siguen. Un elemento que falla por un problema transitorio de infraestructura (por
        ejemplo el escaner de adjuntos no responde) queda como FAILED en vez de tumbar el lote
        completo; su motivo es siempre "Internal error". Los resultados vienen en el mismo orden de
        los elementos de la solicitud. Un lote admite hasta 500 elementos. Un reenvío con el mismo
        batchId del mismo tenant devuelve el resultado original solo si el registro del lote quedó
        guardado; si el guardado falló (trackingSaved=false) no hay registro y el reenvío vuelve a
        procesar los elementos (la deduplicación por externalId evita duplicar notificaciones).
      operationId: sendNotificationBatch
      x-status: available
      x-allowed-roles: [CLIENTE, ADMINISTRADOR_APLICACION, ADMINISTRADOR_PLATAFORMA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendNotificationBatchRequest'
      responses:
        '202':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Lote aceptado -- ver el resultado individual de cada elemento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAcceptedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/PepUnavailable'
        '400':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: >
            La solicitud no cumple el esquema (lista de elementos vacía, ausente o con más de 500
            elementos, campo obligatorio ausente o vacío en algún elemento, prioridad desconocida,
            batchId en blanco). Se rechaza completa sin procesar ningún elemento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /notifications/detail:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/TraceParent'
    get:
      tags: [Notificaciones]
      summary: Consultar el estado de una notificación
      description: CU-04. Devuelve el estado actual, canal, proveedor y marca de tiempo del último intento.
      operationId: getNotificationStatus
      x-status: available
      x-allowed-roles: [CLIENTE, OPERADOR, ADMINISTRADOR_APLICACION, ADMINISTRADOR_PLATAFORMA]
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Estado actual de la notificación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/PepUnavailable'
        '400':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: El parámetro notificationId falta o no es un identificador válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: >
            No existe una notificación con ese id, o no pertenece al tenant del solicitante --
            ambos casos responden igual, para no revelar si el id existe bajo otro cliente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /notification-retries:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/TraceParent'
    post:
      tags: [Notificaciones]
      summary: Reintentar el envío manualmente
      description: >
        CU-06. Solo válido si el estado actual es FAILED o RECOVERABLE. Reencola la notificación y
        registra el reintento como manual (distinto del automático) para efectos de auditoría.
        Requiere rol OPERADOR o ADMINISTRADOR_PLATAFORMA. No reinicia el contador de intentos. 400 con NTF-3022 si el estado actual no admite
        reintento; 409 si otro proceso (manual o automático) ganó la carrera sobre la misma notificación.
      operationId: retryNotification
      x-status: available
      x-allowed-roles: [OPERADOR, ADMINISTRADOR_PLATAFORMA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notificationId]
              properties:
                notificationId:
                  type: string
                  format: uuid
                  description: Identificador de la notificación que se reintenta.
      responses:
        '202':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Reintento aceptado, la notificación vuelve al flujo de despacho.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/PepUnavailable'
        '400':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: El estado actual no admite reintento (ej. ya está DELIVERED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: No existe una notificación con ese id para este tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /attachment-uploads:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/TraceParent'
    post:
      tags: [Adjuntos]
      summary: Pedir una dirección de subida para un archivo grande
      description: >
        Emite una política de subida firmada (formulario multipart por POST) para subir al almacén del
        servicio un archivo de más de 1 MB y hasta 10 MB. La subida nace en PENDING_SCAN. El cliente envía un
        POST multipart a uploadUrl con todos los campos de uploadFields y el campo "file" al final, antes de
        expiresAt; el almacén rechaza un archivo de tamaño distinto de sizeBytes o de un tipo distinto de
        contentType. Después avisa con POST /attachment-upload-completions y referencia el archivo
        en la notificación con attachmentUrl. uploadFields es una credencial temporal: solo aparece en esta
        respuesta.
      operationId: issueAttachmentUpload
      x-status: available
      x-allowed-roles: [CLIENTE, ADMINISTRADOR_APLICACION]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueAttachmentUploadRequest'
      responses:
        '201':
          description: Subida emitida.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Location:
              schema:
                type: string
              description: /attachment-uploads/status?uploadId=<uploadId>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentUploadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: >
            Nombre, tipo, extensión o tamaño inválidos, o tamaño de hasta 1 MB (ese archivo va embebido en
            la notificación).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            X-Decision-Id:
              $ref: '#/components/headers/DecisionId'
          description: >
            El almacén de archivos no está disponible. También lo devuelve el PEP (PEP_UNAVAILABLE)
            cuando no puede decidir el acceso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PepErrorResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /attachment-upload-completions:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/TraceParent'
    post:
      tags: [Adjuntos]
      summary: Avisar que la subida terminó
      description: >
        Comprueba que el archivo está en el almacén y que su tamaño coincide con el declarado, y encola
        su análisis. La subida sigue en PENDING_SCAN hasta que el análisis termina en CLEAN, INFECTED o
        FAILED. Si la subida ya está resuelta, o si otra llamada simultánea ganó la transición, devuelve su
        estado vigente sin volver a analizar. Si la subida ya venció, responde 409 y pasa a FAILED.
      operationId: completeAttachmentUpload
      x-status: available
      x-allowed-roles: [CLIENTE, ADMINISTRADOR_APLICACION]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uploadId]
              properties:
                uploadId:
                  type: string
                  description: Identificador de la subida emitida por POST /attachment-uploads.
      responses:
        '202':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Análisis encolado, o subida ya resuelta (ver state).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentUploadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: >
            El tamaño del archivo subido no coincide con el declarado. El archivo se descarta y la subida
            sigue en PENDING_SCAN: puede volver a subirse mientras la política de subida esté vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: La subida no existe para este tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: >
            El archivo todavía no está en el almacén, o la subida venció (pasa a FAILED con motivo
            EXPIRED y debe pedirse una nueva).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            X-Decision-Id:
              $ref: '#/components/headers/DecisionId'
          description: >
            El almacén de archivos o el broker no están disponibles. También lo devuelve el PEP
            (PEP_UNAVAILABLE) cuando no puede decidir el acceso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PepErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /attachment-uploads/status:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/TraceParent'
    get:
      tags: [Adjuntos]
      summary: Consultar el estado de una subida
      operationId: getAttachmentUpload
      x-status: available
      x-allowed-roles: [CLIENTE, ADMINISTRADOR_APLICACION]
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '200':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Estado actual. Nunca incluye uploadUrl.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentUploadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/PepUnavailable'
        '400':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: El parámetro uploadId falta o está en blanco.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: La subida no existe para este tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /channels:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/TraceParent'
    get:
      tags: [Catálogo]
      summary: Consultar los canales del catálogo y cómo se enrutan
      description: >
        CU-07 (lectura). Devuelve los canales que el enrutamiento está usando en este momento, cada uno
        con sus proveedores en orden de preferencia y el estado de cada proveedor. Hoy el despacho usa
        solo el proveedor en la posición 1; los demás se listan en su orden pero no se usan como
        respaldo automático. El catálogo es del despliegue, no del tenant: la respuesta es la misma
        para cualquier identidad autenticada. Un cambio guardado en el catálogo aparece aquí en el
        mismo refresco en que el enrutamiento empieza a usarlo. Ningún campo contiene el valor de una
        credencial.
      operationId: listChannels
      x-status: available
      x-allowed-roles: [CLIENTE, OPERADOR, EDITOR_PLANTILLAS, AUDITOR, ADMINISTRADOR_APLICACION, ADMINISTRADOR_PLATAFORMA]
      responses:
        '200':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Canales ordenados por channelType (items vacío si el catálogo está vacío).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelCatalogResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/PepUnavailable'
    post:
      tags: [Catálogo]
      summary: Registrar o actualizar un canal
      description: >
        CU-07. Requiere rol ADMINISTRADOR_PLATAFORMA. Da de alta el canal en el catálogo, sin
        desplegar código (RF-19). Si el canal ya existe, esta misma operación lo actualiza.
        Bloqueado: el catálogo dinámico ya existe, pero su escritura por API aún no está
        habilitada.
      operationId: registerChannel
      x-status: planned
      x-allowed-roles: [ADMINISTRADOR_PLATAFORMA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterChannelRequest'
      responses:
        '200':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Canal registrado o actualizado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/PepUnavailable'
        '400':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: El esquema de validación del canal está mal formado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /providers:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/TraceParent'
    get:
      tags: [Catálogo]
      summary: Consultar los proveedores, su estado y dónde se usan
      description: >
        CU-08 (lectura). Devuelve la unión de los proveedores con adaptador en este despliegue y los que
        nombra el catálogo, cada uno con su estado y los canales en que aparece. MISSING_ADAPTER indica
        que el catálogo nombra un proveedor para el que el despliegue no tiene adaptador. El estado de
        habilitación es el de configuración de la réplica que responde, no la salud actual del
        proveedor. Misma respuesta para cualquier identidad autenticada; ningún campo contiene el
        valor de una credencial.
      operationId: listProviders
      x-status: available
      x-allowed-roles: [CLIENTE, OPERADOR, EDITOR_PLANTILLAS, AUDITOR, ADMINISTRADOR_APLICACION, ADMINISTRADOR_PLATAFORMA]
      responses:
        '200':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Proveedores ordenados por providerId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCatalogResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/PepUnavailable'
    post:
      tags: [Catálogo]
      summary: Registrar un proveedor para uno o más canales
      description: >
        CU-08. Requiere rol ADMINISTRADOR_PLATAFORMA y que el adaptador del proveedor ya exista en el
        código (no puede registrarse un providerId sin adaptador). Si falta una credencial
        requerida, el proveedor queda registrado pero deshabilitado -- nunca a medias en silencio.
        Bloqueado hasta que exista el catálogo dinámico (Fase 6).
      operationId: registerProvider
      x-status: planned
      x-allowed-roles: [ADMINISTRADOR_PLATAFORMA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterProviderRequest'
      responses:
        '201':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Proveedor registrado -- ver el campo "enabled" si faltó alguna credencial.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterProviderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/PepUnavailable'
        '404':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: No existe un adaptador de código para ese providerId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /configuration:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/TraceParent'
    get:
      tags: [Configuración]
      summary: Consultar los parámetros gestionables y la configuración en uso
      description: >
        CU-11 (lectura). Requiere rol ADMINISTRADOR_PLATAFORMA. Devuelve el registro de parámetros que el
        servicio permite gestionar y, para la réplica que responde, la versión de la configuración en uso,
        su origen y las claves aceptadas que esperan un reinicio. Ningún campo contiene credenciales,
        topología de colas ni direcciones base.
      operationId: getConfiguration
      x-status: available
      x-allowed-roles: [ADMINISTRADOR_APLICACION, ADMINISTRADOR_PLATAFORMA]
      responses:
        '200':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Configuración en uso de la réplica y registro de parámetros.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/PepUnavailable'
  /recipients/preferences:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/TraceParent'
      - $ref: '#/components/parameters/RecipientId'
    get:
      tags: [Preferencias]
      summary: Consultar las preferencias de un destinatario
      description: >
        CU-09. Devuelve las preferencias vigentes del destinatario dentro del tenant del encabezado.
        Un destinatario que nunca declaró preferencias no es un error: se devuelve el valor por
        defecto (optedOutAll false, acceptedChannels vacía -- todos los canales aceptados -- y
        updatedAt nulo). Las preferencias de un tenant nunca son visibles desde otro, aunque usen el
        mismo recipientId. Requiere rol CLIENTE o ADMINISTRADOR_APLICACION. Planificada: sin controlador REST todavía
        (el mapeo de rol queda documentado para cuando exista).
      operationId: getRecipientPreferences
      x-status: planned
      x-allowed-roles: [CLIENTE, ADMINISTRADOR_APLICACION]
      responses:
        '200':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Preferencias vigentes (por defecto, todos los canales aceptados).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipientPreferencesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/PepUnavailable'
    put:
      tags: [Preferencias]
      summary: Actualizar las preferencias de un destinatario
      description: >
        CU-09. Reemplaza por completo las preferencias del destinatario dentro del tenant del
        encabezado: por qué canales acepta ser contactado, o su baja total (optedOutAll). Desde el
        siguiente despacho -- incluidas las notificaciones ya aceptadas que aún no se enviaron y los
        reintentos --, una notificación de ese destinatario termina en DISCARDED sin contactar a
        ningún proveedor si está dado de baja o si su canal no está entre los aceptados. La aceptación
        de notificaciones no cambia, y las notificaciones ya terminales no se modifican. Requiere rol
        CLIENTE o ADMINISTRADOR_APLICACION. Planificada: sin controlador REST todavía (el mapeo de rol queda
        documentado para cuando exista).
      operationId: updateRecipientPreferences
      x-status: planned
      x-allowed-roles: [CLIENTE, ADMINISTRADOR_APLICACION]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferencesRequest'
      responses:
        '200':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Preferencias actualizadas, tal como quedaron guardadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipientPreferencesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/PepUnavailable'
        '400':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: >
            Cuerpo ausente o una entrada de acceptedChannels vacía o solo con espacios. Las
            preferencias vigentes no cambian.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /notifications/timeline:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/TraceParent'
    get:
      tags: [Notificaciones]
      summary: Consultar la línea de tiempo de una notificación
      description: >
        HU2-118. Devuelve la cabecera de la notificación y sus intentos de entrega ordenados por fecha,
        con latencia, causa del fallo (conjunto cerrado, nunca texto del proveedor) y correlationId.
        El destinatario sale enmascarado salvo para ADMINISTRADOR_PLATAFORMA o ADMINISTRADOR_APLICACION. El tenant sale de la sesión.
        Un identificador inexistente o de otro tenant responde 404.
      operationId: getNotificationTimeline
      x-status: available
      x-allowed-roles: [OPERADOR, ADMINISTRADOR_APLICACION, ADMINISTRADOR_PLATAFORMA]
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Línea de tiempo de la notificación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTimelineResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/PepUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /notification-resends:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/TraceParent'
    post:
      tags: [Notificaciones]
      summary: Reenviar una notificación fallida por otro canal
      description: >
        HU2-117. Solo válido si la notificación original está en FAILED. Crea una notificación nueva
        por el canal indicado, con un externalId derivado de máximo 255 caracteres, y no modifica la
        original. La dirección recibida es dato personal: no se devuelve ni se registra. Requiere
        rol OPERADOR o ADMINISTRADOR_PLATAFORMA. Límite conocido: una notificación original con adjuntos no se
        reenvía y responde 400 con NTF-3070 (RESEND_CHANNEL_INVALID); lo mismo ocurre si el canal nuevo
        es el original o el externalId derivado supera el máximo. Un canal no disponible responde
        400 con NTF-1003 y una dirección con formato inválido para el canal, 400 con NTF-1006. Si
        el estado original no es FAILED, 400 con NTF-3022 (NOTIFICATION_STATE_NOT_ALLOWED).
      operationId: resendNotification
      x-status: available
      x-allowed-roles: [OPERADOR, ADMINISTRADOR_PLATAFORMA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendNotificationRequest'
      responses:
        '202':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Reenvío aceptado; el cuerpo describe la notificación nueva en PENDING.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/PepUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /provider-connection-tests:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/TraceParent'
    post:
      tags: [Catálogo]
      summary: Probar la conexión con un proveedor
      description: >
        HU2-114. Ejecuta una sonda contra el proveedor del canal indicado sin crear notificaciones.
        Responde 200 también cuando la prueba falla (status FAILED con un errorCode cerrado); nunca
        devuelve credenciales ni texto crudo del proveedor. Solo una prueba en vuelo por par (canal,
        proveedor) y por réplica; la segunda recibe 429. Requiere rol ADMINISTRADOR_PLATAFORMA.
      operationId: testProviderConnection
      x-status: available
      x-allowed-roles: [ADMINISTRADOR_PLATAFORMA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderConnectionTestRequest'
      responses:
        '200':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Resultado de la prueba (OK o FAILED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderConnectionTestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Ya hay una prueba en vuelo para ese par canal y proveedor en esta réplica (NTF-3060).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/PepUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /provider-health:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/TraceParent'
    get:
      tags: [Catálogo]
      summary: Consultar la salud de los proveedores
      description: >
        HU2-121. Estado, tasa de éxito, latencia p95 y último error por proveedor y canal, calculados
        sobre las métricas de despacho en una ventana configurable. La respuesta es global (no
        depende del tenant). Límites: un proveedor desactivado con tráfico sale DOWN; los proveedores
        sin tráfico en la ventana no aparecen o salen UNKNOWN; con el breaker de HU2-115 abierto el
        proveedor no recibe intentos y por eso puede salir UNKNOWN o ausente aunque esté caído. Si la fuente de métricas
        no responde, 503 con NTF-5000; el cuerpo nunca incluye su dirección.
      operationId: getProviderHealth
      x-status: available
      x-allowed-roles: [OPERADOR, ADMINISTRADOR_APLICACION, ADMINISTRADOR_PLATAFORMA]
      responses:
        '200':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          description: Salud por proveedor y canal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderHealthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            X-Decision-Id:
              $ref: '#/components/headers/DecisionId'
          description: >
            La fuente de métricas no está disponible (ErrorResponse, NTF-5000) o el PEP no pudo decidir
            el acceso (PEP_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PepErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

